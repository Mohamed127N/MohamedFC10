function nextMatchRand() {
  LIVE_MATCH.rngState = (LIVE_MATCH.rngState * 1664525 + 1013904223) >>> 0;
  return LIVE_MATCH.rngState / 4294967296;
}

function logMatchEvent(minute, team, type, text, meta = null) {
  if (!LIVE_MATCH) return;
  LIVE_MATCH.event_log.unshift({
    id: LIVE_MATCH.event_log.length + 1,
    minute: Math.min(90, Math.max(0, Math.round(minute))),
    team,
    type,
    text,
    meta
  });
}

function startMatchMasterLoop() {
  stopMatchLoop();
  if (!LIVE_MATCH) return;
  LIVE_MATCH.lastTickMs = performance.now();

  MATCH_TIMER_ID = setInterval(() => {
    try {
      const m = LIVE_MATCH;
      if (!m || m.finished) {
        stopMatchLoop();
        return;
      }

      const nowMs = performance.now();
      const rawDt = (nowMs - m.lastTickMs) / 1000;
      m.lastTickMs = nowMs;

      if (m.paused) {
        if (GAME_STATE.activeTab === 'match') render2DMatchFrame(0.016, nowMs);
        return;
      }

      const wallDt = Math.min(0.25, Math.max(0.005, rawDt));

      if (m.activeReplay) {
        stepInstantReplayFrame(wallDt, nowMs);
        return;
      }

      let rem = wallDt;
      while (rem > 0 && !m.finished) {
        const stepDt = Math.min(0.025, rem);
        rem -= stepDt;
        stepMatchPhysicsFrame(stepDt, nowMs);
      }

      if (GAME_STATE.activeTab === 'match') {
        render2DMatchFrame(wallDt, nowMs);
        m.uiSyncAccumulator += wallDt;
        if (m.uiSyncAccumulator >= 0.22) {
          m.uiSyncAccumulator = 0;
          updateLiveMatchTelemetryDOM();
        }
      } else {
        m.uiSyncAccumulator += wallDt;
        if (m.uiSyncAccumulator >= 0.4) {
          m.uiSyncAccumulator = 0;
          updateBackgroundMatchBar();
        }
      }
    } catch (err) {
      console.error('Match tick recovered:', err);
    }
  }, 20);
}

function updateBackgroundMatchBar() {
  const bar = document.getElementById('bg-match-bar');
  if (!bar) return;
  const m = LIVE_MATCH;
  if (!m || m.finished || GAME_STATE.activeTab === 'match') {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  bar.innerHTML = `
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 font-black">
        <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
        <span>مباراة جارية الآن (${Math.floor(m.minute)}'): ${GAME_STATE.club.name} ${m.homeScore} - ${m.awayScore} ${m.opponent.club.name}</span>
      </div>
      <button onclick="switchTab('match')" class="px-3 py-1 rounded-lg bg-lime-400 text-slate-950 font-black text-[11px]">العودة للملعب 2D ←</button>
    </div>
  `;
}

function stepMatchPhysicsFrame(dt, nowMs) {
  const m = LIVE_MATCH;
  m.elapsedRealSeconds = Math.min(m.totalRealSeconds, m.elapsedRealSeconds + dt);
  m.minute = Math.min(90, (m.elapsedRealSeconds / m.totalRealSeconds) * 90);

  if (!m.halftimeLogged && m.minute >= 45) {
    m.halftimeLogged = true;
    logMatchEvent(45, 'home', 'HALFTIME', `نهاية الشوط الأول: ${GAME_STATE.club.name} ${m.homeScore} - ${m.awayScore} ${m.opponent.club.name}`, null);
  }

  const pressMult = GAME_STATE.tactics.defensivePress === 'high' ? 1.25 : (GAME_STATE.tactics.defensivePress === 'low' ? 0.85 : 1.0);
  for (const p of m.homePlayers) {
    if (!p.redCard) {
      const stamStat = p.attrs.stamina || p.ovr || 80;
      const drainRate = 0.13 * pressMult * (1.18 - (stamStat - 70) * 0.006);
      p.stamina = Math.max(52, p.stamina - Math.max(0.06, drainRate) * dt);
      if (p.tackleCooldown > 0) p.tackleCooldown = Math.max(0, p.tackleCooldown - dt);
    }
  }
  for (const p of m.awayPlayers) {
    if (!p.redCard) {
      const stamStat = p.attrs.stamina || p.ovr || 80;
      const drainRate = 0.13 * (1.18 - (stamStat - 70) * 0.006);
      p.stamina = Math.max(52, p.stamina - Math.max(0.06, drainRate) * dt);
      if (p.tackleCooldown > 0) p.tackleCooldown = Math.max(0, p.tackleCooldown - dt);
    }
  }

  if (m.possessionTeam === 'home' || m.possessionTeam === 'away') {
    m.stats[m.possessionTeam].possessionTicks += dt;
  }

  if (m.kickoffPauseUntil && nowMs < m.kickoffPauseUntil) {
    updateContinuousPlayerAI(dt, nowMs);
    return;
  }

  updateContinuousBallPhysics(dt, nowMs);
  updateContinuousPlayerAI(dt, nowMs);
  recordReplaySnapshot();

  if (m.elapsedRealSeconds >= m.totalRealSeconds) {
    m.minute = 90;
    m.finished = true;
    stopMatchLoop();
    logMatchEvent(90, 'home', 'FULLTIME', `صافرة النهاية! ${GAME_STATE.club.name} ${m.homeScore} - ${m.awayScore} ${m.opponent.club.name}`, null);
    finalizeMatchAndGenerateReport();
    updateBackgroundMatchBar();
    if (GAME_STATE.activeTab === 'match') {
      renderApp();
    } else {
      showToast(`انتهت المباراة: ${GAME_STATE.club.name} ${m.homeScore} - ${m.awayScore} ${m.opponent.club.name}`, 'success');
    }
  }
}

function launchPhysicalBallPassOrShot(fromPlayer, toX, toY, speedPctPerSec, loftVz, actionType, receiverUid = null, shotMeta = null) {
  const m = LIVE_MATCH;
  const dx = toX - m.ballX;
  const dy = toY - m.ballY;
  const dist = Math.max(0.5, Math.hypot(dx, dy));
  m.ballStartX = m.ballX;
  m.ballStartY = m.ballY;
  m.ballVx = (dx / dist) * speedPctPerSec;
  m.ballVy = (dy / dist) * speedPctPerSec;
  m.ballVz = loftVz;
  m.ballInFlight = true;
  m.ballActionType = actionType;
  m.intendedReceiverUid = receiverUid;
  m.shotContext = shotMeta;
  m.ballOwnerUid = null;
  m.carrierHoldTime = 0;
  fromPlayer.kickUntil = performance.now() + 320;
}

/**
 * Helper: Computes dynamic game-state mentality modifier based on current scoreline and minute.
 * - Trailing team pushes higher, presses aggressively, and shoots sooner.
 * - Leading team late in the game tightens defensively and hits on lethal counter-attacks.
 */
function getDynamicGameSituation(team) {
  const m = LIVE_MATCH;
  const myGoals = team === 'home' ? m.homeScore : m.awayScore;
  const oppGoals = team === 'home' ? m.awayScore : m.homeScore;
  const goalDiff = myGoals - oppGoals;
  const isLateGame = m.minute >= 68;

  if (goalDiff < 0) {
    // Trailing: Ultra-attacking urgency, high press, forward verticality
    return {
      mode: 'CHASING',
      forwardBias: goalDiff <= -2 ? 1.45 : 1.32,
      shotUrgencyMult: isLateGame ? 1.45 : 1.25,
      pressBoost: 1.30,
      linePushY: isLateGame ? 11.5 : 7.5
    };
  }
  if (goalDiff > 0 && isLateGame) {
    // Protecting a lead late in the match: Compact block + fast counters
    return {
      mode: 'PROTECTING',
      forwardBias: 1.05,
      shotUrgencyMult: 1.12,
      pressBoost: 0.90,
      linePushY: -6.5
    };
  }
  return {
    mode: 'COMPETITIVE',
    forwardBias: 1.18,
    shotUrgencyMult: 1.15,
    pressBoost: 1.0,
    linePushY: 2.0
  };
}

function updateContinuousBallPhysics(dt, nowMs) {
  const m = LIVE_MATCH;
  const r = nextMatchRand;
  const allPlayers = [
    ...m.homePlayers.filter(p => !p.redCard).map(p => ({ p, team: 'home' })),
    ...m.awayPlayers.filter(p => !p.redCard).map(p => ({ p, team: 'away' }))
  ];

  // 1. BALL DRIBBLED BY CARRIER
  if (!m.ballInFlight && m.ballOwnerUid) {
    const carrierObj = allPlayers.find(x => x.p.uid === m.ballOwnerUid);
    if (!carrierObj) {
      m.ballInFlight = true;
      m.ballActionType = 'LOOSE';
      return;
    }
    const carrier = carrierObj.p;
    const team = carrierObj.team;
    const oppTeam = team === 'home' ? 'away' : 'home';
    m.possessionTeam = team;
    m.lastTouchTeam = team;
    m.carrierHoldTime += dt;

    const speedMag = Math.hypot(carrier.vx, carrier.vy);
    const dirX = speedMag > 0.2 ? carrier.vx / speedMag : Math.sin(m.dribbleAngle);
    const dirY = speedMag > 0.2 ? carrier.vy / speedMag : (team === 'home' ? -1 : 1);
    const touchOffset = 1.15 + Math.abs(Math.sin(nowMs * 0.014)) * 0.5;
    m.ballX = Math.max(2, Math.min(98, carrier.currX + dirX * touchOffset));
    m.ballY = Math.max(2, Math.min(98, carrier.currY + dirY * touchOffset));
    m.ballZ = Math.abs(Math.sin(nowMs * 0.016)) * 0.08;

    // Defender Tackling & Ball-Winning Physics (Strongly influenced by player OVR & attributes)
    const defenders = allPlayers.filter(x => x.team === oppTeam && x.p.zonePos !== 'GK');
    for (const defObj of defenders) {
      const def = defObj.p;
      if (def.tackleCooldown > 0) continue;
      const dist = Math.hypot(def.currX - carrier.currX, def.currY - carrier.currY);
      if (dist < 2.35 && m.carrierHoldTime > 0.30) {
        const defSkill = ((def.attrs.tackling || def.ovr) * 0.50 + (def.attrs.defending || def.ovr) * 0.30 + (def.ovr) * 0.20) * (def.stamina / 100);
        const dribSkill = ((carrier.attrs.dribbling || carrier.ovr) * 0.50 + (carrier.attrs.agility || carrier.ovr) * 0.25 + (carrier.ovr) * 0.25) * (carrier.stamina / 100);
        // Stronger attackers beat weak defenders cleanly; elite defenders dispossess weak attackers reliably
        const skillGap = defSkill - dribSkill;
        const tackleWinChance = Math.max(0.12, Math.min(0.76, 0.35 + skillGap * 0.017)) * dt * 5.2;

        if (r() < tackleWinChance) {
          def.kickUntil = nowMs + 300;
          def.rating = Math.min(9.9, def.rating + 0.09);
          carrier.tackleCooldown = 1.15;
          m.possessionTeam = oppTeam;
          m.ballOwnerUid = def.uid;
          m.carrierHoldTime = 0;
          m.prevPasserUid = null;
          m.lastPasserUid = null;
          return;
        } else {
          def.tackleCooldown = 1.05;
          carrier.rating = Math.min(9.9, carrier.rating + 0.03);
        }
      }
    }

    evaluateCarrierDecision(carrier, team, nowMs);
    return;
  }

  // 2. BALL IN FLIGHT PHYSICS
  m.ballX += m.ballVx * dt;
  m.ballY += m.ballVy * dt;
  m.ballZ += m.ballVz * dt;

  if (m.ballZ > 0) {
    m.ballVz -= 9.8 * dt;
  } else {
    m.ballZ = 0;
    if (Math.abs(m.ballVz) > 1.2) {
      m.ballVz = -m.ballVz * 0.42;
    } else {
      m.ballVz = 0;
    }
    const friction = Math.pow(0.45, dt);
    m.ballVx *= friction;
    m.ballVy *= friction;
  }

  const ballSpeed = Math.hypot(m.ballVx, m.ballVy);

  // 3. GOAL LINE & SCORING CHECK
  if (m.ballY <= 0.8 || m.ballY >= 99.2) {
    const attackingTeam = m.ballY <= 0.8 ? 'home' : 'away';
    const defendingTeam = attackingTeam === 'home' ? 'away' : 'home';
    const inGoalMouth = m.ballX >= 41.8 && m.ballX <= 58.2 && m.ballZ <= 2.75;

    if (inGoalMouth && m.ballActionType === 'SHOT' && m.shotContext) {
      const ctx = m.shotContext;
      const reasonTag = ctx.assister
        ? `بعد تمريرة حاسمة من ${ctx.assister.name}!`
        : (ctx.shotType === '1V1' ? 'بعد انفراد تام بالحارس!' : (ctx.shotType === 'POWER' ? 'بتسديدة صاروخية في الشباك!' : 'بتسديدة متقنة داخل المرمى!'));
      recordGoal(m, attackingTeam, ctx.shooter, ctx.assister, reasonTag);
      return;
    } else {
      const defSquad = defendingTeam === 'home' ? m.homePlayers : m.awayPlayers;
      const gk = defSquad.find(p => p.zonePos === 'GK') || defSquad[0];
      if (m.ballActionType === 'SHOT' && m.shotContext) {
        logMatchEvent(m.minute, attackingTeam, 'SHOT_MISS', `تسديدة من ${m.shotContext.shooter.name} تمر بجوار القائم.`, { shooter: m.shotContext.shooter.name });
      }
      m.ballInFlight = false;
      m.ballActionType = 'DRIBBLE';
      m.shotContext = null;
      m.possessionTeam = defendingTeam;
      m.ballOwnerUid = gk.uid;
      m.carrierHoldTime = 0;
      m.ballX = gk.currX;
      m.ballY = gk.currY;
      m.ballZ = 0;
      m.ballVx = 0;
      m.ballVy = 0;
      return;
    }
  }

  if (m.ballX <= 1.5 || m.ballX >= 98.5) {
    m.ballX = Math.max(2.0, Math.min(98.0, m.ballX));
    m.ballVx = -m.ballVx * 0.45;
  }

  // 4. INTELLIGENT ARCHETYPE-AWARE GOALKEEPER SAVE ENGINE
  if (m.ballActionType === 'SHOT' && m.shotContext && !m.shotContext.gkChecked) {
    const defTeam = m.shotContext.team === 'home' ? 'away' : 'home';
    const defSquad = defTeam === 'home' ? m.homePlayers : m.awayPlayers;
    const gk = defSquad.find(p => p.zonePos === 'GK');
    if (gk) {
      const distToGK = Math.hypot(gk.currX - m.ballX, gk.currY - m.ballY);
      if (distToGK < 5.0 && m.ballZ <= 2.75) {
        m.shotContext.gkChecked = true;
        const gkProf = gk.gkProfile || buildGoalkeeperProfile(PLAYER_BY_ID.get(gk.player_id), gk.attrs, gk.ovr);
        const shotType = m.shotContext.shotType || 'NORMAL';
        const shotPower = m.shotContext.finishingAttr || 80;
        const shooterOvr = m.shotContext.shooter?.ovr || 80;

        // Calculate specialized goalkeeper effectiveness based on shot type & GK archetype
        let effectiveGKSkill = (gkProf.reflexes * 0.35 + gkProf.diving * 0.35 + gkProf.positioning * 0.22 + gkProf.handling * 0.08);
        if (shotType === '1V1') {
          effectiveGKSkill += (gkProf.archetype === 'SWEEPER_1V1' ? 6.5 : 0) + (gkProf.reflexes - 80) * 0.22;
        } else if (shotType === 'POWER') {
          effectiveGKSkill += (gkProf.archetype === 'POWER_STOPPER' ? 6.5 : 0) + (gkProf.diving + gkProf.handling - 160) * 0.18;
        } else if (shotType === 'HEADER') {
          effectiveGKSkill += (gkProf.archetype === 'AERIAL_COMMANDER' ? 6.5 : 0) + (gkProf.positioning - 80) * 0.25;
        } else if (gkProf.archetype === 'CAT_REFLEX') {
          effectiveGKSkill += 4.5;
        }

        // True quality gap: Top GK (89+) stops most average shots; weak GK (75) concedes frequently to elite strikers (90+)
        const qualityDelta = (effectiveGKSkill - ((shotPower * 0.65) + (shooterOvr * 0.35)));
        const baseSaveRate = shotType === '1V1' ? 0.34 : (shotType === 'POWER' ? 0.44 : 0.48);
        const saveChance = Math.max(0.22, Math.min(0.78, baseSaveRate + qualityDelta * 0.014));

        gk.diveOffsetX = (m.ballX - gk.currX) * 1.35;
        gk.diveUntil = nowMs + 750;

        if (r() < saveChance) {
          gk.saves += 1;
          gk.rating = Math.min(9.9, gk.rating + 0.28);
          m.stats[defTeam].saves += 1;

          // Strong handlers catch cleanly; lower handling parries into corners or rebounds
          const cleanCatchChance = Math.max(0.35, Math.min(0.82, 0.45 + (gkProf.handling - 75) * 0.014));
          if (r() > cleanCatchChance) {
            const shotTeam = m.shotContext.team;
            m.stats[shotTeam].corners += 1;
            const cornerX = m.ballX >= 50 ? 92 : 8;
            const cornerY = defTeam === 'home' ? 88 : 12;
            m.ballVx = (cornerX - m.ballX) * 1.8;
            m.ballVy = (cornerY - m.ballY) * 1.8;
            m.ballVz = 2.6;
            m.ballActionType = 'LOOSE';
            m.shotContext = null;
            logMatchEvent(m.minute, shotTeam, 'CORNER', `الحارس ${gk.name} (${gkProf.labelAr}) يبعد التسديدة ببراعة إلى ركنية!`, { gk: gk.name });
          } else {
            m.ballInFlight = false;
            m.ballActionType = 'DRIBBLE';
            m.possessionTeam = defTeam;
            m.ballOwnerUid = gk.uid;
            m.carrierHoldTime = 0;
            m.ballVx = 0;
            m.ballVy = 0;
            m.ballZ = 0;
            logMatchEvent(m.minute, defTeam, 'SAVE', `تصدٍّ مذهل من الحارس ${gk.name} (${gkProf.labelAr}) أمام تسديدة ${m.shotContext.shooter.name}!`, { gk: gk.name, shooter: m.shotContext.shooter.name });
            m.shotContext = null;
          }
          return;
        }
      }
    }
  }

  // 5. BALL RECEPTION & INTERCEPTION PHYSICS
  if (m.ballZ <= 1.85) {
    let bestCollector = null;
    let bestDist = Infinity;

    for (const item of allPlayers) {
      const p = item.p;
      if (p.tackleCooldown > 0) continue;
      if (p.uid === m.lastPasserUid && m.carrierHoldTime < 0.22 && ballSpeed > 18) continue;

      const d = Math.hypot(p.currX - m.ballX, p.currY - m.ballY);
      const controlRadius = (p.uid === m.intendedReceiverUid) ? 2.85 : 1.95;
      if (d < controlRadius && d < bestDist) {
        if (item.team !== m.lastTouchTeam && ballSpeed > 24 && m.ballActionType !== 'SHOT') {
          const intSkill = ((p.attrs.interceptions || p.ovr) * 0.55 + (p.attrs.positioning || p.ovr) * 0.25 + p.ovr * 0.20);
          const intChance = Math.max(0.22, Math.min(0.84, 0.44 + (intSkill - 78) * 0.014));
          if (r() > intChance) continue;
        }
        bestDist = d;
        bestCollector = item;
      }
    }

    if (bestCollector) {
      const collector = bestCollector.p;
      const cTeam = bestCollector.team;
      if (cTeam === m.lastTouchTeam && (m.ballActionType === 'PASS' || m.ballActionType === 'THROUGH' || m.ballActionType === 'CROSS')) {
        m.stats[cTeam].passesSuccess += 1;
        const passer = allPlayers.find(x => x.p.uid === m.lastPasserUid)?.p;
        if (passer) passer.rating = Math.min(9.9, passer.rating + 0.03);
      } else if (cTeam !== m.lastTouchTeam) {
        collector.rating = Math.min(9.9, collector.rating + 0.05);
        m.prevPasserUid = null;
      }

      m.ballInFlight = false;
      m.ballActionType = 'DRIBBLE';
      m.possessionTeam = cTeam;
      m.ballOwnerUid = collector.uid;
      m.intendedReceiverUid = null;
      m.shotContext = null;
      m.carrierHoldTime = 0;
      m.ballVx = 0;
      m.ballVy = 0;
      m.ballZ = 0;
    } else if (ballSpeed < 4.5 && m.ballZ <= 0.1) {
      let nearest = null;
      let nd = Infinity;
      for (const item of allPlayers) {
        const d = Math.hypot(item.p.currX - m.ballX, item.p.currY - m.ballY);
        if (d < nd) { nd = d; nearest = item; }
      }
      if (nearest) {
        m.ballInFlight = false;
        m.ballActionType = 'DRIBBLE';
        m.possessionTeam = nearest.team;
        m.ballOwnerUid = nearest.p.uid;
        m.carrierHoldTime = 0;
        m.ballX = nearest.p.currX;
        m.ballY = nearest.p.currY;
      }
    }
  }
}

/**
 * Purpose-Driven Attacking & Tactical Decision Engine for the Ball Carrier:
 * 1. Immediate Goal-Seeking & Shooting when in scoring range or 1v1 with GK.
 * 2. Intelligent Wing Crosses into the Penalty Box.
 * 3. Progressive Forward Passing & Through-Balls into Space.
 * 4. Strict Anti-Back-Pass Logic: Back-passes are ONLY permitted if the carrier is
 *    heavily pressed with zero forward options AND did not just receive a backward pass.
 */
function evaluateCarrierDecision(carrier, team, nowMs) {
  const m = LIVE_MATCH;
  const r = nextMatchRand;
  const oppTeam = team === 'home' ? 'away' : 'home';
  const teammates = (team === 'home' ? m.homePlayers : m.awayPlayers).filter(p => !p.redCard && p.uid !== carrier.uid);
  const opponents = (oppTeam === 'home' ? m.homePlayers : m.awayPlayers).filter(p => !p.redCard);
  const atkProf = team === 'home' ? m.homeProfile : m.awayProfile;
  const defProf = oppTeam === 'home' ? m.homeProfile : m.awayProfile;
  const buildSpeed = team === 'home' ? GAME_STATE.tactics.buildUpSpeed : 'balanced';
  const situation = getDynamicGameSituation(team);
  const forwardSign = team === 'home' ? -1 : 1;

  // Overall quality advantage of attacking team vs defending team
  const teamQualityEdge = (atkProf.effectiveOverall - defProf.effectiveOverall);

  const goalY = team === 'home' ? 1.0 : 99.0;
  const distToGoal = Math.hypot(50 - carrier.currX, goalY - carrier.currY);

  let nearestDefDist = 999;
  let defendersBetweenBallAndGoal = 0;
  for (const opp of opponents) {
    if (opp.zonePos === 'GK') continue;
    const d = Math.hypot(opp.currX - carrier.currX, opp.currY - carrier.currY);
    if (d < nearestDefDist) nearestDefDist = d;
    const oppCloserToGoal = (opp.currY - carrier.currY) * forwardSign > 0;
    if (oppCloserToGoal && Math.abs(opp.currX - carrier.currX) < 16) {
      defendersBetweenBallAndGoal++;
    }
  }

  // A. GOALKEEPER QUICK DISTRIBUTION FORWARD
  if (carrier.zonePos === 'GK' && m.carrierHoldTime > 0.38) {
    // Prefer midfielders and fullbacks over standing still; strong GKs can launch counters
    const outfieldTargets = teammates.filter(t => t.zonePos !== 'GK');
    const sortedTargets = outfieldTargets.sort((a, b) => {
      const aAdv = (a.currY - carrier.currY) * forwardSign;
      const bAdv = (b.currY - carrier.currY) * forwardSign;
      const idealDistA = Math.abs(aAdv - 34);
      const idealDistB = Math.abs(bAdv - 34);
      return idealDistA - idealDistB;
    });
    const pickPool = sortedTargets.slice(0, 4);
    const target = pickPool[Math.floor(r() * pickPool.length)] || outfieldTargets[0];
    if (target) {
      m.stats[team].passesTotal += 1;
      carrier.passes += 1;
      m.prevPasserUid = m.lastPasserUid;
      m.lastPasserUid = carrier.uid;
      launchPhysicalBallPassOrShot(carrier, target.currX, target.currY + forwardSign * 3, 44, 1.8, 'PASS', target.uid);
    }
    return;
  }

  // B. DECISIVE SHOOTING & 1v1 FINISHING (No hesitation in front of goal!)
  if (carrier.zonePos !== 'GK' && distToGoal < 31 && m.carrierHoldTime > 0.18) {
    const is1v1 = (distToGoal < 19 && defendersBetweenBallAndGoal === 0);
    const isInsideBox = (distToGoal < 18 && Math.abs(carrier.currX - 50) < 20);
    const isLongShotZone = (distToGoal >= 18 && distToGoal < 31 && Math.abs(carrier.currX - 50) < 18);

    // Striker/Winger/CAM shooting instinct scaled by player quality & game urgency
    const shooterSkill = ((carrier.attrs.finishing || carrier.ovr) * 0.55 + (carrier.attrs.shooting || carrier.ovr) * 0.45);
    let shootProb = 0;
    if (is1v1) shootProb = 0.88;
    else if (isInsideBox) shootProb = 0.68;
    else if (isLongShotZone && nearestDefDist > 4.2) shootProb = 0.24 + Math.max(0, (shooterSkill - 80) * 0.012);

    shootProb *= situation.shotUrgencyMult;
    if (Math.abs(carrier.currX - 50) > 23) shootProb *= 0.35; // Tight angle -> prefer cross or cutback

    if (shootProb > 0 && r() < shootProb) {
      m.stats[team].shotsTotal += 1;
      carrier.shots += 1;

      const finishAttr = shooterSkill * carrier.fit * (0.85 + 0.15 * (carrier.stamina / 100));
      // Elite finishers put way more shots on target than weak players
      const onTargetProb = Math.max(0.42, Math.min(0.86, 0.56 + (finishAttr - 78) * 0.011 + teamQualityEdge * 0.008));
      const isOnTarget = r() < onTargetProb;
      if (isOnTarget) {
        m.stats[team].shotsOnTarget += 1;
      }

      // Aim towards corners of the goal mouth (42.5 to 57.5)
      const aimCorner = r() > 0.5 ? (43.2 + r() * 3.5) : (53.3 + r() * 3.5);
      const aimX = isOnTarget
        ? aimCorner
        : (r() > 0.5 ? (58.6 + r() * 5.0) : (41.4 - r() * 5.0));

      const assister = (m.lastPasserUid && m.lastPasserUid !== carrier.uid)
        ? teammates.find(t => t.uid === m.lastPasserUid) || null
        : null;

      const shotType = is1v1 ? '1V1' : (distToGoal >= 19 ? 'POWER' : 'NORMAL');
      const shotSpeed = Math.max(48, Math.min(64, 50 + (finishAttr - 75) * 0.42));

      launchPhysicalBallPassOrShot(
        carrier,
        aimX,
        goalY,
        shotSpeed,
        0.95 + r() * 0.95,
        'SHOT',
        null,
        { team, shooter: carrier, assister, finishingAttr: finishAttr, shotType }
      );
      return;
    }
  }

  // C. WING PLAY & DANGEROUS PENALTY-BOX CROSSES
  const isFinalThird = team === 'home' ? carrier.currY < 27 : carrier.currY > 73;
  const isWideFlank = carrier.currX < 25 || carrier.currX > 75;
  if (isFinalThird && isWideFlank && m.carrierHoldTime > 0.28 && r() < 0.55) {
    const boxRunners = teammates.filter(t => t.zonePos === 'ST' || t.zonePos === 'CM' || t.zonePos === 'RW' || t.zonePos === 'LW');
    const target = boxRunners.sort((a, b) => Math.abs(a.currX - 50) - Math.abs(b.currX - 50))[0] || teammates[0];
    if (target) {
      m.stats[team].passesTotal += 1;
      m.stats[team].crosses += 1;
      carrier.passes += 1;
      m.prevPasserUid = m.lastPasserUid;
      m.lastPasserUid = carrier.uid;
      const crossX = 44 + r() * 12;
      const crossY = team === 'home' ? (8 + r() * 5.5) : (92 - r() * 5.5);
      launchPhysicalBallPassOrShot(carrier, crossX, crossY, 40, 2.8, 'CROSS', target.uid);
      return;
    }
  }

  // D. PROGRESSIVE FORWARD PASSING & THROUGH-BALLS (Anti-Back-Pass Engine)
  const maxHold = buildSpeed === 'fast' ? 0.52 : (buildSpeed === 'slow' ? 0.95 : 0.72);
  // Strong teams circulate crisply; weak teams hold too long or panic under press
  const passUrgency = nearestDefDist < 6.0 ? 0.62 : (m.carrierHoldTime > maxHold ? 0.72 : 0.16);

  if (m.carrierHoldTime > 0.26 && r() < passUrgency) {
    let bestForwardTarget = null;
    let bestForwardScore = -999;
    let bestEmergencyBackTarget = null;
    let bestEmergencyScore = -999;

    for (const mate of teammates) {
      // Never pass back to GK unless desperate in deep defensive third
      if (mate.zonePos === 'GK') continue;

      const dist = Math.hypot(mate.currX - carrier.currX, mate.currY - carrier.currY);
      if (dist < 6 || dist > 52) continue;

      const forwardGain = (mate.currY - carrier.currY) * forwardSign; // > 0 means closer to opponent goal!

      let minOppDist = 999;
      for (const opp of opponents) {
        const od = Math.hypot(opp.currX - mate.currX, opp.currY - mate.currY);
        if (od < minOppDist) minOppDist = od;
      }
      const openness = Math.min(20, minOppDist * 1.5);

      // Progressive forward or dangerous lateral-attacking pass (forwardGain >= -3)
      if (forwardGain >= -3.0) {
        const attackerBonus = (mate.zonePos === 'ST' || mate.zonePos === 'RW' || mate.zonePos === 'LW') ? 7.5 : 0;
        const score = (forwardGain * 0.95 * situation.forwardBias) + openness + attackerBonus - Math.abs(dist - 22) * 0.20 + (r() - 0.5) * 6;
        if (score > bestForwardScore) {
          bestForwardScore = score;
          bestForwardTarget = mate;
        }
      } else {
        // Backward pass candidate: ONLY considered in true tactical emergencies
        // Prevent ping-pong back-passing to the player who just passed to us
        if (mate.uid === m.lastPasserUid || mate.uid === m.prevPasserUid) continue;
        const emergScore = openness + forwardGain * 0.5;
        if (emergScore > bestEmergencyScore) {
          bestEmergencyScore = emergScore;
          bestEmergencyBackTarget = mate;
        }
      }
    }

    // Use forward target whenever available; only use backward pass if heavily pressed (< 3.8 distance) & no forward lane
    const chosenTarget = bestForwardTarget || (nearestDefDist < 3.8 ? bestEmergencyBackTarget : null);

    if (chosenTarget) {
      const passSkill = ((carrier.attrs.passing || carrier.ovr) * 0.55 + (carrier.attrs.vision || carrier.ovr) * 0.30 + carrier.ovr * 0.15) * carrier.fit;
      const dist = Math.hypot(chosenTarget.currX - carrier.currX, chosenTarget.currY - carrier.currY);
      const forwardGain = (chosenTarget.currY - carrier.currY) * forwardSign;
      const isThrough = (forwardGain > 11 && dist > 15 && r() < (0.42 + Math.max(0, (passSkill - 80) * 0.015)));

      // Weak teams make noticeably more passing errors than elite teams
      const midDelta = (atkProf.midfieldStrength - defProf.midfieldStrength) * 0.12;
      const errorMargin = Math.max(0.25, (97 - passSkill - midDelta) * 0.095);
      const leadY = chosenTarget.currY + (isThrough ? forwardSign * 6.5 : forwardSign * 2.2) + (r() - 0.5) * errorMargin;
      const leadX = Math.max(5, Math.min(95, chosenTarget.currX + (r() - 0.5) * errorMargin));

      m.stats[team].passesTotal += 1;
      carrier.passes += 1;
      m.prevPasserUid = m.lastPasserUid;
      m.lastPasserUid = carrier.uid;

      if (isThrough) {
        m.stats[team].throughBalls += 1;
        logMatchEvent(m.minute, team, 'THROUGH_BALL', `تمريرة بينية قاتلة من ${carrier.name} خلف الدفاع لـ ${chosenTarget.name}`, { passer: carrier.name, receiver: chosenTarget.name });
      }

      const passSpeed = Math.max(36, Math.min(54, 34 + dist * 0.48 + (passSkill - 75) * 0.18));
      launchPhysicalBallPassOrShot(carrier, leadX, leadY, passSpeed, isThrough ? 1.0 : 0.18, isThrough ? 'THROUGH' : 'PASS', chosenTarget.uid);
    }
  }
}

/**
 * Dynamic Off-The-Ball Movement, Pressing, Defensive Shape & Goalkeeper Positioning AI
 */
function updateContinuousPlayerAI(dt, nowMs) {
  const m = LIVE_MATCH;
  const tac = GAME_STATE.tactics;
  const ballShiftY = (m.ballY - 50) * 0.42;
  const ballShiftX = (m.ballX - 50) * 0.25;

  const updateSquad = (squad, isHome) => {
    const team = isHome ? 'home' : 'away';
    const isAttacking = (m.possessionTeam === team);
    const forwardSign = isHome ? -1 : 1;
    const ownGoalY = isHome ? 92 : 8;
    const style = isHome ? tac.playStyle : m.awayPlayStyle;
    const pressMode = isHome ? tac.defensivePress : 'balanced';
    const situation = getDynamicGameSituation(team);
    const depthShift = isHome ? ((tac.defensiveDepth - 50) * 0.20 * forwardSign) : 0;
    const widthMult = isHome ? (0.86 + (tac.pitchWidth / 100) * 0.30) : 1.0;
    const stylePush = (style === 'attacking' ? (8.5 * forwardSign) : (style === 'defensive' ? (-6.5 * forwardSign) : 0)) + (situation.linePushY * forwardSign);

    let primaryPresserUid = null;
    let secondaryCoverUid = null;
    if (!isAttacking) {
      let d1 = Infinity, d2 = Infinity;
      for (const p of squad) {
        if (p.redCard || p.zonePos === 'GK') continue;
        const d = Math.hypot(p.currX - m.ballX, p.currY - m.ballY);
        if (d < d1) {
          d2 = d1; secondaryCoverUid = primaryPresserUid;
          d1 = d; primaryPresserUid = p.uid;
        } else if (d < d2) {
          d2 = d; secondaryCoverUid = p.uid;
        }
      }
    }

    for (const p of squad) {
      if (p.redCard) continue;
      const instr = isHome ? (tac.playerInstructions[p.uid] || 'DEFAULT') : 'DEFAULT';
      const paceStat = p.attrs.pace || p.ovr || 78;
      // Quality and pace directly control player movement speed and sharpness
      const maxSpeedPct = (15.0 + (paceStat - 70) * 0.18 + (p.ovr - 78) * 0.08) * (0.76 + 0.24 * (p.stamina / 100));

      if (p.zonePos === 'GK') {
        const gkProf = p.gkProfile || { archetype: 'BALANCED_WALL', positioning: 82 };
        const lateralFactor = gkProf.archetype === 'AERIAL_COMMANDER' ? 0.28 : 0.23;
        const lateralFollow = 50 + (m.ballX - 50) * lateralFactor + (p.diveOffsetX || 0);
        // Sweeper GKs narrow the angle aggressively when attackers break through
        const sweeperAdvance = (gkProf.archetype === 'SWEEPER_1V1' && !isAttacking && Math.abs(m.ballY - ownGoalY) < 28) ? (-3.8 * forwardSign) : 0;
        const shotStepOut = (m.ballActionType === 'SHOT' && m.ballInFlight && !isAttacking) ? (-2.4 * forwardSign) : 0;
        p.targetX = Math.max(41, Math.min(59, lateralFollow));
        p.targetY = ownGoalY + sweeperAdvance + shotStepOut;
      } else if (p.uid === m.ballOwnerUid && !m.ballInFlight) {
        // Ball carrier drives directly and purposefully toward the opponent's penalty box!
        const goalY = isHome ? 5 : 95;
        const distToGoal = Math.hypot(50 - p.currX, goalY - p.currY);
        // Wingers cut inside once near the penalty area; central players attack the box directly
        const targetLaneX = (p.zonePos === 'RW' || p.zonePos === 'LW') && distToGoal > 24
          ? (p.zonePos === 'RW' ? (isHome ? 82 : 18) : (isHome ? 18 : 82))
          : 50 + (p.baseX - 50) * 0.22;
        const weave = Math.sin(nowMs * 0.005 + p.player_id) * 4.5;
        p.targetX = Math.max(8, Math.min(92, targetLaneX + weave));
        p.targetY = Math.max(6, Math.min(94, goalY));
        m.dribbleAngle = Math.atan2(p.targetX - p.currX, p.targetY - p.currY);
      } else if (p.uid === m.intendedReceiverUid && m.ballInFlight) {
        p.targetX = Math.max(6, Math.min(94, m.ballX + m.ballVx * 0.22));
        p.targetY = Math.max(6, Math.min(94, m.ballY + m.ballVy * 0.22));
      } else if (p.uid === primaryPresserUid) {
        p.targetX = Math.max(6, Math.min(94, m.ballX));
        p.targetY = Math.max(6, Math.min(94, m.ballY - forwardSign * 1.2));
      } else if (p.uid === secondaryCoverUid && (pressMode !== 'low' || situation.mode === 'CHASING')) {
        p.targetX = Math.max(8, Math.min(92, (m.ballX + 50) * 0.5));
        p.targetY = Math.max(8, Math.min(92, m.ballY - forwardSign * 7.5));
      } else {
        let instrOffsetY = 0;
        if (instr === 'STAY_BACK') instrOffsetY = -7 * forwardSign;
        else if (instr === 'GET_IN_BEHIND') instrOffsetY = 10 * forwardSign;

        // Attackers & midfielders make aggressive forward runs into the box during attacks
        const roleAttackSurge = isAttacking
          ? (p.zonePos === 'ST' ? 14 * forwardSign : ((p.zonePos === 'RW' || p.zonePos === 'LW') ? 12 * forwardSign : (p.zonePos === 'CM' ? 9 * forwardSign : 4 * forwardSign)))
          : (-5.5 * forwardSign);

        const compactFactor = (isAttacking ? 1.04 : 0.85) * widthMult;
        const laneRunX = isAttacking ? Math.sin(nowMs * 0.0022 + p.player_id) * 4.2 : 0;
        const laneRunY = isAttacking ? Math.cos(nowMs * 0.0025 + p.player_id) * 3.5 : 0;

        // Strikers & Wingers pinch into the penalty box when the ball is in the final third
        const inFinalThird = isHome ? m.ballY < 32 : m.ballY > 68;
        const boxPinchX = (isAttacking && inFinalThird && (p.zonePos === 'ST' || p.zonePos === 'RW' || p.zonePos === 'LW'))
          ? 50 + (p.baseX - 50) * 0.35
          : 50 + (p.baseX - 50) * compactFactor + ballShiftX + laneRunX;

        const relY = p.baseY + ballShiftY + stylePush + depthShift + roleAttackSurge + instrOffsetY + laneRunY;
        p.targetX = Math.max(6, Math.min(94, boxPinchX));
        p.targetY = Math.max(6, Math.min(94, relY));
      }

      const dx = p.targetX - p.currX;
      const dy = p.targetY - p.currY;
      const dist = Math.hypot(dx, dy);
      const desiredSpeed = dist > 0.3 ? Math.min(maxSpeedPct, dist * 3.8) : 0;
      const desiredVx = dist > 0.3 ? (dx / dist) * desiredSpeed : 0;
      const desiredVy = dist > 0.3 ? (dy / dist) * desiredSpeed : 0;

      const accel = Math.min(1, dt * 7.0);
      p.vx += (desiredVx - p.vx) * accel;
      p.vy += (desiredVy - p.vy) * accel;

      p.currX = Math.max(4, Math.min(96, p.currX + p.vx * dt));
      p.currY = Math.max(4, Math.min(96, p.currY + p.vy * dt));
    }
  };

  updateSquad(m.homePlayers, true);
  updateSquad(m.awayPlayers, false);
}

function recordReplaySnapshot() {
  const m = LIVE_MATCH;
  m.replayBuffer.push({
    ballX: m.ballX,
    ballY: m.ballY,
    ballZ: m.ballZ,
    players: [...m.homePlayers, ...m.awayPlayers].map(p => ({
      uid: p.uid,
      x: p.currX,
      y: p.currY,
      diveOffsetX: p.diveOffsetX || 0
    }))
  });
  if (m.replayBuffer.length > 180) m.replayBuffer.shift();
}

function triggerGoalReplay() {
  const m = LIVE_MATCH;
  if (!m || !m.lastGoalReplayClip || m.lastGoalReplayClip.length < 15) {
    showToast('لا توجد لقطة هدف مسجلة للإعادة بعد!', 'info');
    return;
  }
  m.activeReplay = {
    frames: m.lastGoalReplayClip,
    cursor: 0
  };
  showToast('إعادة تلفزيونية بطيئة للهدف! (2D Slow-Mo Replay)', 'info');
}

function stepInstantReplayFrame(dt, nowMs) {
  const m = LIVE_MATCH;
  const rep = m.activeReplay;
  if (!rep) return;
  rep.cursor += dt * 30;
  const idx = Math.floor(rep.cursor);
  if (idx >= rep.frames.length) {
    m.activeReplay = null;
    return;
  }
  const snap = rep.frames[idx];
  m.ballX = snap.ballX;
  m.ballY = snap.ballY;
  m.ballZ = snap.ballZ;
  snap.players.forEach(sp => {
    const hp = m.homePlayers.find(x => x.uid === sp.uid);
    if (hp) { hp.currX = sp.x; hp.currY = sp.y; hp.diveOffsetX = sp.diveOffsetX; }
    const ap = m.awayPlayers.find(x => x.uid === sp.uid);
    if (ap) { ap.currX = sp.x; ap.currY = sp.y; ap.diveOffsetX = sp.diveOffsetX; }
  });
  if (GAME_STATE.activeTab === 'match') render2DMatchFrame(dt, nowMs);
}

function recordGoal(m, team, scorer, assister, reasonText) {
  if (team === 'home') m.homeScore += 1;
  else m.awayScore += 1;

  m.stats[team].goals += 1;
  scorer.goals += 1;
  scorer.rating = Math.min(10.0, scorer.rating + 1.1);
  if (assister) {
    assister.assists += 1;
    assister.rating = Math.min(10.0, assister.rating + 0.6);
  }

  m.lastGoalReplayClip = m.replayBuffer.slice(-140);

  const teamName = team === 'home' ? GAME_STATE.club.name : m.opponent.club.name;
  logMatchEvent(
    m.minute,
    team,
    'GOAL',
    `هدف لـ ${teamName}! سجله ${scorer.name} ${reasonText}`,
    {
      scorer: scorer.name,
      assister: assister ? assister.name : null,
      score: `${m.homeScore}-${m.awayScore}`,
      reason: reasonText
    }
  );

  m.bannerAlert = {
    title: `هدف! ${teamName}`,
    sub: `${Math.round(m.minute)}' • ${scorer.name} ${assister ? `(صناعة: ${assister.name})` : ''}`,
    team
  };
  setTimeout(() => { if (LIVE_MATCH) LIVE_MATCH.bannerAlert = null; }, 3400);

  const concedingTeam = team === 'home' ? 'away' : 'home';
  const kickSquad = concedingTeam === 'home' ? m.homePlayers : m.awayPlayers;
  const kicker = kickSquad.find(p => p.zonePos === 'ST') || kickSquad[Math.min(9, kickSquad.length - 1)];

  m.possessionTeam = concedingTeam;
  m.ballOwnerUid = kicker.uid;
  m.ballInFlight = false;
  m.ballActionType = 'DRIBBLE';
  m.shotContext = null;
  m.intendedReceiverUid = null;
  m.prevPasserUid = null;
  m.lastPasserUid = null;
  m.ballX = 50;
  m.ballY = 50;
  m.ballZ = 0;
  m.ballVx = 0;
  m.ballVy = 0;
  m.ballVz = 0;
  m.carrierHoldTime = 0;
  m.kickoffPauseUntil = performance.now() + 950;

  m.homePlayers.forEach(p => { p.diveOffsetX = 0; });
  m.awayPlayers.forEach(p => { p.diveOffsetX = 0; });
  kicker.currX = 50;
  kicker.currY = 50;
}

function executeLiveSubstitution(outUid, benchInstId) {
  const m = LIVE_MATCH;
  if (!m || m.finished) return;
  if (m.homeSubCount >= 5) {
    showToast('وصلت للحد الأقصى للتبديلات (5 تبديلات)!', 'error');
    return;
  }
  if (m.subbedOutUids.includes(benchInstId) || m.homePlayers.some(p => p.uid === benchInstId)) {
    showToast('هذا اللاعب غير متاح للتبديل!', 'error');
    return;
  }

  const slotIdx = m.homePlayers.findIndex(p => p.uid === outUid);
  if (slotIdx === -1) return;
  const outPlayer = m.homePlayers[slotIdx];
  const inData = getInstanceFullData(benchInstId);
  if (!inData) return;

  const gkProfile = outPlayer.zonePos === 'GK' ? buildGoalkeeperProfile(inData.player, inData.card.attributes, inData.ovr) : null;

  const newLivePlayer = {
    uid: benchInstId,
    player_id: inData.player.player_id,
    shirt_number: inData.player.shirt_number || 14,
    dna: getPlayerVisualDNA(inData.player),
    name: inData.player.display_name,
    pos: inData.player.primary_position,
    zonePos: outPlayer.zonePos,
    ovr: inData.ovr,
    fit: getPositionalFit(inData.player, outPlayer.zonePos),
    attrs: inData.card.attributes,
    gkProfile,
    baseX: outPlayer.baseX,
    baseY: outPlayer.baseY,
    currX: outPlayer.currX,
    currY: outPlayer.currY,
    vx: 0,
    vy: 0,
    targetX: outPlayer.targetX,
    targetY: outPlayer.targetY,
    diveOffsetX: 0,
    diveUntil: 0,
    kickUntil: 0,
    tackleCooldown: 0,
    stamina: 100,
    yellowCards: 0,
    redCard: false,
    goals: 0,
    assists: 0,
    shots: 0,
    passes: 0,
    saves: 0,
    rating: 6.5
  };

  if (m.ballOwnerUid === outUid) {
    m.ballOwnerUid = benchInstId;
  }

  m.homePlayers[slotIdx] = newLivePlayer;
  m.subbedOutUids.push(outUid);
  m.homeSubCount += 1;

  const startersForEval = m.homePlayers.map(p => ({
    player: PLAYER_BY_ID.get(p.player_id),
    card: getInstanceFullData(p.uid)?.card || CARD_BY_ID.get(`c_${p.player_id}_std`),
    ovr: p.ovr,
    zonePos: p.zonePos
  }));
  m.homeProfile = evaluateTeamTacticalProfile(startersForEval, GAME_STATE.tactics, GAME_STATE.coaches);

  logMatchEvent(m.minute, 'home', 'SUB', `تبديل تكتيكي: دخول ${newLivePlayer.name} بدلاً من ${outPlayer.name}.`, { in: newLivePlayer.name, out: outPlayer.name });
  showToast(`تم التبديل: ${newLivePlayer.name} يدخل الملعب`, 'success');
  closeModal();
  updateLiveMatchTelemetryDOM();
}

function finalizeMatchAndGenerateReport() {
  const m = LIVE_MATCH;
  const hStats = m.stats.home;
  const aStats = m.stats.away;

  const totalPoss = hStats.possessionTicks + aStats.possessionTicks;
  const homePossPct = Math.round((hStats.possessionTicks / totalPoss) * 100);
  const awayPossPct = 100 - homePossPct;
  const homePassAcc = hStats.passesTotal > 0 ? Math.round((hStats.passesSuccess / hStats.passesTotal) * 100) : 0;
  const awayPassAcc = aStats.passesTotal > 0 ? Math.round((aStats.passesSuccess / aStats.passesTotal) * 100) : 0;

  m.homePlayers.forEach(lp => {
    const owned = GAME_STATE.roster.find(r => r.card_instance_id === lp.uid);
    if (owned) {
      owned.goals_scored = (owned.goals_scored || 0) + lp.goals;
      owned.assists = (owned.assists || 0) + lp.assists;
      owned.matches_played = (owned.matches_played || 0) + 1;
      owned.goal_bonus = Math.min(4, Math.floor(owned.goals_scored / 5));
    }
  });

  const weeklyWageBill = Number(GAME_STATE.roster.reduce((s, r) => s + (r.weekly_wage || 0.04), 0).toFixed(2));

  let outcome = 'DRAW';
  let prize = 3.5;
  if (m.homeScore > m.awayScore) {
    outcome = 'WIN';
    prize = 7.5;
    GAME_STATE.achievements.first_win = true;
    GAME_STATE.club.boardConfidence = Math.min(100, GAME_STATE.club.boardConfidence + 3);
    GAME_STATE.club.fanSupport = Math.min(100, GAME_STATE.club.fanSupport + 3);
    GAME_STATE.manager.reputation = Math.min(99, GAME_STATE.manager.reputation + 1);
    if (m.awayScore === 0) GAME_STATE.achievements.clean_sheet = true;
  } else if (m.homeScore < m.awayScore) {
    outcome = 'LOSS';
    prize = 1.5;
    GAME_STATE.club.boardConfidence = Math.max(25, GAME_STATE.club.boardConfidence - 3);
    GAME_STATE.club.fanSupport = Math.max(30, GAME_STATE.club.fanSupport - 2);
  }
  if (m.homePlayers.some(p => p.goals >= 3)) GAME_STATE.achievements.hat_trick = true;
  if (GAME_STATE.roster.reduce((s, r) => s + (r.goals_scored || 0), 0) >= 50) GAME_STATE.achievements.goals_50 = true;

  GAME_STATE.budget = Number(Math.max(0, GAME_STATE.budget + prize - weeklyWageBill).toFixed(1));

  simulateLeagueRoundWithUserResult(m.homeScore, m.awayScore);
  GAME_STATE.club.round += 1;

  if (GAME_STATE.club.round % 2 === 0 && GAME_STATE.roster.length > 14) {
    generateIncomingAITransferOffer();
  }

  if (GAME_STATE.club.round > 38) {
    handleEndOfSeasonCeremony();
  }

  const allParticipants = [...m.homePlayers, ...m.awayPlayers];
  const motm = [...allParticipants].sort((a, b) => (b.rating + b.goals * 0.8 + b.saves * 0.25) - (a.rating + a.goals * 0.8 + a.saves * 0.25))[0];

  const reasons = [];
  if (outcome === 'WIN') {
    reasons.push(`تفوق تكتيكي واستغلال الفرص بـ ${hStats.shotsOnTarget} تسديدات مركزة على المرمى.`);
    if (homePassAcc >= 82) reasons.push(`سيطرة في وسط الميدان بدقة تمرير ${homePassAcc}%.`);
  } else if (outcome === 'LOSS') {
    reasons.push(`تفوق الخصم في الفعالية الهجومية (${aStats.goals} أهداف من ${aStats.shotsOnTarget} تسديدات على المرمى).`);
  } else {
    reasons.push(`تكافؤ كبير في الاستحواذ (${homePossPct}% مقابل ${awayPossPct}%) والتنظيم الدفاعي.`);
  }

  const report = {
    matchId: `match_${Date.now()}`,
    date: `الموسم ${GAME_STATE.club.season} • الجولة ${GAME_STATE.club.round - 1}`,
    competition: m.opponent.competition,
    outcome,
    prize,
    wagePaid: weeklyWageBill,
    homeClub: GAME_STATE.club.name,
    awayClub: m.opponent.club.name,
    homeScore: m.homeScore,
    awayScore: m.awayScore,
    possession: { home: homePossPct, away: awayPossPct },
    passAcc: { home: homePassAcc, away: awayPassAcc },
    stats: { home: { ...hStats }, away: { ...aStats } },
    event_log: [...m.event_log],
    motm: { name: motm.name, rating: motm.rating.toFixed(1), goals: motm.goals, saves: motm.saves },
    reasons,
    nextRecommendation: outcome === 'LOSS'
      ? 'راجع عمق الدفاع وأسلوب الضغط في غرفة التكتيك قبل الجولة القادمة.'
      : 'استمر في تدوير اللاعبين والحفاظ على اللياقة البدنية في مركز التدريب.'
  };

  GAME_STATE.lastReport = report;
  GAME_STATE.matchHistory.unshift(report);
  GAME_STATE.currentOpponent = null;
  persistState();
}

function handleEndOfSeasonCeremony() {
  const rank = GAME_STATE.leagueTable.findIndex(t => t.clubId === GAME_STATE.club.id) + 1;
  if (rank === 1) {
    GAME_STATE.manager.trophiesWon += 1;
    GAME_STATE.trophyCabinet.unshift({
      season: GAME_STATE.club.season,
      title: 'بطل الدوري الممتاز',
      club: GAME_STATE.club.name
    });
    GAME_STATE.budget = Number((GAME_STATE.budget + 45).toFixed(1));
  }
  GAME_STATE.inbox.unshift({
    id: `mail_season_${Date.now()}`,
    from: 'اتحاد كرة القدم ومجلس الإدارة',

    body: rank === 1
      ? `تهانينا! تُوّج ${GAME_STATE.club.name} بلقب الدوري الممتاز وحصل النادي على مكافأة بطل الدوري (€45.0M)!`
      : `انتهى الموسم ${GAME_STATE.club.season} في المركز #${rank}. استعد للموسم الجديد وفترة الانتقالات الصيفية!`,
    date: `نهاية الموسم ${GAME_STATE.club.season}`,

  });

}

function generateIncomingAITransferOffer() {
  const candidates = GAME_STATE.roster.filter(r => !GAME_STATE.lineup.some(s => s.instance_id === r.card_instance_id));
  const target = candidates[Math.floor(Math.random() * candidates.length)] || GAME_STATE.roster[0];
  if (!target) return;
  const d = getInstanceFullData(target.card_instance_id);
  if (!d) return;
  const buyerClub = REAL_CLUBS.filter(c => c.id !== GAME_STATE.club.id)[Math.floor(Math.random() * 15)];
  const offerFee = Number((d.card.price * (1.05 + Math.random() * 0.25)).toFixed(1));

  GAME_STATE.inbox.unshift({
    id: `offer_${Date.now()}`,
    from: buyerClub.name,
    subject: `عرض رسمي للتعاقد مع ${d.player.display_name} (€${offerFee}M)`,
    body: `يتقدم نادي ${buyerClub.name} بعرض رسمي بقيمة €${offerFee}M لشراء بطاقة اللاعب ${d.player.display_name} (${d.ovr} OVR).`,
    date: `الموسم ${GAME_STATE.club.season} • الجولة ${GAME_STATE.club.round}`,
    read: false,
    type: 'TRANSFER_OFFER',
    offerMeta: {
      instanceId: target.card_instance_id,
      playerName: d.player.display_name,
      buyerClub: buyerClub.name,
      fee: offerFee,
      resolved: false
    }
  });
}

function acceptIncomingOffer(mailId) {
  const mail = GAME_STATE.inbox.find(m => m.id === mailId);
  if (!mail || !mail.offerMeta || mail.offerMeta.resolved) return;
  const { instanceId, playerName, buyerClub, fee } = mail.offerMeta;

  if (GAME_STATE.roster.length <= 12) {
    showToast('لا يمكن إتمام البيع: قائمة الفريق وصلت للحد الأدنى!', 'error');
    return;
  }

  GAME_STATE.roster = GAME_STATE.roster.filter(r => r.card_instance_id !== instanceId);
  GAME_STATE.bench = GAME_STATE.bench.filter(b => b !== instanceId);
  GAME_STATE.lineup = GAME_STATE.lineup.filter(s => s.instance_id !== instanceId);
  GAME_STATE.budget = Number((GAME_STATE.budget + fee).toFixed(1));
  mail.offerMeta.resolved = true;
  mail.read = true;

  GAME_STATE.transferLedger.unshift({
    type: 'SELL',
    playerName,
    edition: buyerClub,
    ovr: '',
    amount: fee,
    date: `جولة ${GAME_STATE.club.round}`
  });

  persistState();
  showToast(`تم بيع ${playerName} إلى ${buyerClub} مقابل +€${fee}M!`, 'success');
  renderApp();
}

  NEGOTIATION_STATE = {
    cardId,
    playerId: player.player_id,
    mode,
    step: 'FEE',
    askFee,
    offerFee: Number((askFee * 0.92).toFixed(1)),

    offerWage: askWage,

function submitTransferFeeOffer() {
  const neg = NEGOTIATION_STATE;
  if (!neg) return;
  if (GAME_STATE.budget < neg.offerFee) {
    showToast(`ميزانيتك الحالية (€${GAME_STATE.budget.toFixed(1)}M) لا تكفي لهذا العرض!`, 'error');
    return;
  }
  if (neg.offerFee >= neg.askFee * 0.94) {
    neg.step = 'WAGE';
    neg.clubReply = `وافق النادي البائع على قيمة الصفقة (€${neg.offerFee.toFixed(1)}M)! الآن تفاوض مع وكيل اللاعب على الراتب ومدة العقد.`;
    renderNegotiationModal();
  } else {
    neg.patience -= 1;
    if (neg.patience <= 0) {
      closeModal();
      showToast('انسحب النادي البائع من المفاوضات بسبب انخفاض العرض!', 'error');
      return;
    }
    const counter = Number(((neg.askFee + neg.offerFee) / 2).toFixed(1));
    neg.askFee = counter;
    neg.offerFee = counter;
    neg.clubReply = `نرفض هذا المبلغ، لكننا مستعدون لإتمام الصفقة مقابل €${counter.toFixed(1)}M كعرض نهائي.`;
    renderNegotiationModal();
  }
}

function finalizeContractSigning() {
  const neg = NEGOTIATION_STATE;
  if (!neg) return;
  const card = CARD_BY_ID.get(neg.cardId);
  const player = PLAYER_BY_ID.get(neg.playerId);
  const totalFee = neg.mode === 'LOAN' ? Number((card.price * 0.18).toFixed(1)) : neg.offerFee;

  if (GAME_STATE.budget < totalFee) {
    showToast(`الميزانية غير كافية! المطلوب €${totalFee}M`, 'error');
    return;
  }

  GAME_STATE.budget = Number((GAME_STATE.budget - totalFee).toFixed(1));
  const instId = `inst_${player.player_id}_${Date.now()}_${Math.floor(Math.random() * 999)}`;

  GAME_STATE.roster.push({
    card_instance_id: instId,
    player_id: player.player_id,
    card_id: card.card_id,
    edition: card.edition,
    base_rating: card.base_rating,
    goal_bonus: 0,
    training_bonus: 0,
    goals_scored: 0,
    assists: 0,
    matches_played: 0,
    contract_years: neg.mode === 'LOAN' ? 1 : neg.contractYears,
    weekly_wage: neg.offerWage,
    is_loaned_in: neg.mode === 'LOAN',
    is_loaned_out: false,
    injury_rounds: 0,
    suspension_rounds: 0,
    morale: 92,
    acquired_at: new Date().toISOString()
  });

  if (GAME_STATE.bench.length < MAX_BENCH) {
    GAME_STATE.bench.push(instId);
  }
  if (card.base_rating >= 100) GAME_STATE.achievements.galactico_signing = true;

  GAME_STATE.transferLedger.unshift({
    type: neg.mode === 'LOAN' ? 'LOAN' : 'BUY',
    playerName: player.display_name,
    edition: card.edition,
    ovr: card.base_rating,
    amount: totalFee,
    date: `جولة ${GAME_STATE.club.round}`
  });

  NEGOTIATION_STATE = null;
  closeModal();
  persistState();
  showToast(`تم التوقيع الرسمي مع ${player.display_name} (${neg.mode === 'LOAN' ? 'إعارة' : 'انتقال دائم'})!`, 'success');
  renderApp();
}

function sellOwnedPlayer(instanceId) {
  if (GAME_STATE.roster.length <= 12) {
    showToast('لا يمكن البيع: يجب الاحتفاظ بـ 12 لاعباً على الأقل في النادي!', 'error');
    return;
  }
  const data = getInstanceFullData(instanceId);
  if (!data) return;

  const isStarter = GAME_STATE.lineup.some(s => s.instance_id === instanceId);
  const replacement = GAME_STATE.roster.find(r =>
    r.card_instance_id !== instanceId &&
    !GAME_STATE.lineup.some(s => s.instance_id === r.card_instance_id)
  );

  if (isStarter && !replacement) {
    showToast('لا يوجد لاعب بديل متاح لتعويض هذا اللاعب الأساسي!', 'error');
    return;
  }

  const sellValue = Number((data.card.price * 0.82).toFixed(1));
  if (isStarter && replacement) {
    const slot = GAME_STATE.lineup.find(s => s.instance_id === instanceId);
    slot.instance_id = replacement.card_instance_id;
    GAME_STATE.bench = GAME_STATE.bench.filter(b => b !== replacement.card_instance_id);
  }
  GAME_STATE.bench = GAME_STATE.bench.filter(b => b !== instanceId);
  GAME_STATE.roster = GAME_STATE.roster.filter(r => r.card_instance_id !== instanceId);
  GAME_STATE.budget = Number((GAME_STATE.budget + sellValue).toFixed(1));

  GAME_STATE.transferLedger.unshift({
    type: 'SELL',
    playerName: data.player.display_name,
    edition: data.card.edition,
    ovr: data.ovr,
    amount: sellValue,
    date: `جولة ${GAME_STATE.club.round}`
  });

  persistState();
  showToast(`تم بيع ${data.player.display_name} مقابل +€${sellValue.toFixed(1)}M`, 'info');
  renderApp();
}

function renewPlayerContract(instanceId) {
  const data = getInstanceFullData(instanceId);
  if (!data) return;
  const bonusCost = Number((data.card.price * 0.06 + 0.5).toFixed(1));
  if (GAME_STATE.budget < bonusCost) {
    showToast(`تحتاج إلى €${bonusCost}M كمكافأة توقيع لتجديد العقد.`, 'error');
    return;
  }
  GAME_STATE.budget = Number((GAME_STATE.budget - bonusCost).toFixed(1));
  data.inst.contract_years = Math.min(5, (data.inst.contract_years || 1) + 3);
  data.inst.morale = Math.min(100, (data.inst.morale || 80) + 12);
  persistState();
  showToast(`تم تجديد عقد ${data.player.display_name} لمدة ${data.inst.contract_years} سنوات!`, 'success');
  renderApp();
}

    return;
  }
  GAME_STATE.budget = Number((GAME_STATE.budget - cost).toFixed(1));
  generateInitialYouthProspects();
  persistState();
  showToast('عاد الكشافون بمواهب جديدة في أكاديمية الشباب!', 'success');

function trainCoach(coachId) {
  const coach = GAME_STATE.coaches.find(c => c.coach_id === coachId);
  if (!coach) return;
  const cost = Number((3.0 + coach.level * 1.5).toFixed(1));
  if (GAME_STATE.budget < cost) {
    showToast(`الميزانية غير كافية! تكلفة الدورة التدريبية €${cost}M`, 'error');
    return;
  }

  GAME_STATE.budget = Number((GAME_STATE.budget - cost).toFixed(1));
  GAME_STATE.trainingSessionCounter = (GAME_STATE.trainingSessionCounter || 0) + 1;
  coach.level += 1;
  coach.xp += 100;

  let affectedCount = 0;
  GAME_STATE.roster.forEach(inst => {
    const p = PLAYER_BY_ID.get(inst.player_id);
    if (!p) return;
    const line = POS_LINE[p.primary_position];
    const matchSpec =
      (coach.specialty === 'DEFENCE' && line === 'DEF') ||
      (coach.specialty === 'ATTACK' && line === 'ATT') ||
      (coach.specialty === 'MIDFIELD' && line === 'MID') ||
      (coach.specialty === 'GOALKEEPER' && line === 'GK');

    if (matchSpec) {
      affectedCount++;
      if (GAME_STATE.trainingSessionCounter % 2 === 0 && (inst.training_bonus || 0) < 10) {
        inst.training_bonus = (inst.training_bonus || 0) + 1;
      }
    }
  });

  coach.logs.unshift({
    date: `جولة ${GAME_STATE.club.round}`,
    note: `ترقية ${coach.title_ar} إلى المستوى ${coach.level} — تطوير ${affectedCount} لاعباً في الفريق.`
  });

  persistState();
  showToast(`تم تطوير ${coach.title_ar} للمستوى ${coach.level}!`, 'success');
  renderApp();
}

function trainSpecificPlayer(instanceId) {
  const data = getInstanceFullData(instanceId);
  if (!data) return;
  const cost = 4.0;
  if (GAME_STATE.budget < cost) {
    showToast('تحتاج إلى €4.0M لبدء معسكر تدريبي فردي مكثف.', 'error');
    return;
  }
  if ((data.inst.training_bonus || 0) >= 10) {
    showToast('وصل هذا اللاعب إلى الحد الأقصى للتطوير التدريبي (+10 OVR)!', 'info');
    return;
  }
  GAME_STATE.budget = Number((GAME_STATE.budget - cost).toFixed(1));
  data.inst.training_bonus = (data.inst.training_bonus || 0) + 1;
  persistState();
  showToast(`ارتفع تقييم ${data.player.display_name} إلى ${getInstanceEffectiveOVR(data.inst)} OVR!`, 'success');
  renderApp();
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const colors = {
    success: 'bg-emerald-950/95 border-emerald-400 text-emerald-100',
    error: 'bg-rose-950/95 border-rose-400 text-rose-100',
    info: 'bg-slate-900/95 border-cyan-400 text-slate-100'
  };
  const el = document.createElement('div');
  el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-2xl text-xs sm:text-sm font-bold flex items-center justify-between gap-2 animate-slide-up ${colors[type] || colors.info}`;
  el.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100 font-black">✕</button>`;
  container.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
}

function openModal(htmlContent) {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  if (!backdrop || !content) return;
  content.innerHTML = htmlContent;
  backdrop.classList.remove('hidden');
  backdrop.classList.add('flex');
}

function closeModal() {
  const backdrop = document.getElementById('modal-backdrop');
  if (!backdrop) return;
  backdrop.classList.add('hidden');
  backdrop.classList.remove('flex');
}

function toggleTheme() {
  GAME_STATE.theme = GAME_STATE.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.classList.toggle('dark', GAME_STATE.theme === 'dark');
  document.documentElement.classList.toggle('light', GAME_STATE.theme !== 'dark');
  persistState();
}

function switchTab(tabId) {
  GAME_STATE.activeTab = tabId;
  persistState();
  updateBackgroundMatchBar();
  renderApp();
}

  const c1 = club?.c1 || '#10b981';

  return `

      <path d="M32 4 L56 14 V32 C56 47 45 56 32 60 C19 56 8 47 8 32 V14 Z" fill="${c1}" stroke="${c2}" stroke-width="4"/>
      <path d="M32 8 L51 16 V32 C51 44 42 52 32 55 Z" fill="${c2}" opacity="0.22"/>
      <text x="32" y="37" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="900" font-size="15" fill="${c1 === '#ffffff' || c1 === '#f8fafc' || c1 === '#facc15' ? '#0f172a' : '#ffffff'}">${short}</text>

}

  const matchOvr = calculateMatchOVR();

  const elBudget = document.getElementById('top-budget');
  const elClub = document.getElementById('header-club-name');

  const elCrest = document.getElementById('header-club-crest');
  const elWinBadge = document.getElementById('header-window-badge');

  if (elMatch) elMatch.textContent = matchOvr.toFixed(1);
  if (elBudget) elBudget.textContent = `€${GAME_STATE.budget.toFixed(1)}M`;

function renderApp() {
  updateTopTelemetry();
  renderMainNav();
  const main = document.getElementById('app-main');
  if (!main) return;

  if (!GAME_STATE.careerStarted && (!GAME_STATE.roster || GAME_STATE.roster.length === 0)) {
    main.innerHTML = renderClubSelectionWizard();
    return;
  }

  switch (GAME_STATE.activeTab) {
    case 'home':
      main.innerHTML = renderHomeTab();
      break;
    case 'squad':
      main.innerHTML = renderSquadTab();
      attachPitchDragHandlers();
      break;
    case 'market':
      main.innerHTML = renderMarketTab();
      break;
    case 'match':
      main.innerHTML = renderMatchTab();
      if (LIVE_MATCH) {
        const canvas = document.getElementById('match-2d-canvas');
        if (canvas) {
          init2DBroadcastPitch(canvas);
          render2DMatchFrame(0.016, performance.now());
        }
      }
      break;
    case 'competitions':
      main.innerHTML = renderCompetitionsTab();
      break;
    case 'training':
      main.innerHTML = renderTrainingTab();
      break;
    case 'office':
      main.innerHTML = renderOfficeTab();
      break;
    default:
      main.innerHTML = renderHomeTab();
  }
}

function applyFormationPreset(formName) {

    if (slots[idx]) {
      item.x = slots[idx].x;

    }
  });
  persistState();

}

function handleBenchClick(benchInstId) {
  if (selectedStarterSlotIdx === null) {
    showToast('اضغط أولاً على لاعب أساسي في الملعب لتحديده، ثم اختر البديل.', 'info');
    return;
  }
  const starterSlot = GAME_STATE.lineup[selectedStarterSlotIdx];
  if (!starterSlot) return;
  const oldStarterId = starterSlot.instance_id;
  const benchIdx = GAME_STATE.bench.indexOf(benchInstId);
  if (benchIdx === -1) return;

  starterSlot.instance_id = benchInstId;
  GAME_STATE.bench[benchIdx] = oldStarterId;
  selectedStarterSlotIdx = null;
  persistState();
  showToast('تم التبديل بين اللاعب الأساسي والبديل!', 'success');
  renderApp();
}

function attachPitchDragHandlers() {
  const pitch = document.getElementById('tactical-pitch-box');
  if (!pitch) return;
  const tokens = pitch.querySelectorAll('.pitch-token');

  tokens.forEach(token => {
    const slotIdx = parseInt(token.getAttribute('data-slot-idx'), 10);
    let dragging = false;
    let moved = false;

    const onPointerDown = (e) => {
      e.preventDefault();
      dragging = true;
      moved = false;
      token.classList.add('dragging');
      token.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (!dragging) return;
      moved = true;
      const rect = pitch.getBoundingClientRect();
      const pctX = Math.max(8, Math.min(92, ((e.clientX - rect.left) / rect.width) * 100));
      const pctY = Math.max(10, Math.min(93, ((e.clientY - rect.top) / rect.height) * 100));
      token.style.left = `${pctX}%`;
      token.style.top = `${pctY}%`;
      if (GAME_STATE.lineup[slotIdx]) {
        GAME_STATE.lineup[slotIdx].x = Number(pctX.toFixed(1));
        GAME_STATE.lineup[slotIdx].y = Number(pctY.toFixed(1));
      }
    };

    const onPointerUp = (e) => {
      if (!dragging) return;
      dragging = false;
      token.classList.remove('dragging');
      try { token.releasePointerCapture(e.pointerId); } catch (err) {}
      if (!moved) {
        selectedStarterSlotIdx = (selectedStarterSlotIdx === slotIdx) ? null : slotIdx;
      }
      persistState();
      renderApp();
    };

    token.addEventListener('pointerdown', onPointerDown);
    token.addEventListener('pointermove', onPointerMove);
    token.addEventListener('pointerup', onPointerUp);
  });
}

function renderLiveStatsInner(m) {
  const totalP = m.stats.home.possessionTicks + m.stats.away.possessionTicks;
  const hPoss = Math.round((m.stats.home.possessionTicks / totalP) * 100);
  const aPoss = 100 - hPoss;
  return `
    <div><span class="text-[10px] text-slate-400 block">الاستحواذ</span><strong class="text-emerald-400">${hPoss}%</strong> - <strong class="text-rose-400">${aPoss}%</strong></div>
    <div><span class="text-[10px] text-slate-400 block">التسديدات</span><strong>${m.stats.home.shotsTotal}</strong> - <strong>${m.stats.away.shotsTotal}</strong></div>
    <div><span class="text-[10px] text-slate-400 block">على المرمى</span><strong class="text-lime-400">${m.stats.home.shotsOnTarget}</strong> - <strong class="text-amber-400">${m.stats.away.shotsOnTarget}</strong></div>
    <div><span class="text-[10px] text-slate-400 block">التصديات</span><strong>${m.stats.home.saves}</strong> - <strong>${m.stats.away.saves}</strong></div>
  `;
}

function renderLiveEventFeedInner(m) {
  return m.event_log.slice(0, 40).map(ev => {
    const isGoal = ev.type === 'GOAL';
    const isSave = ev.type === 'SAVE';
    const boxStyle = isGoal
      ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200 font-black'
      : (isSave ? 'bg-cyan-500/15 border-cyan-500/40 text-cyan-200' : 'bg-slate-100 dark:bg-slate-900/90 border-slate-200 dark:border-slate-800');
    return `
      <div class="p-2.5 rounded-xl border ${boxStyle} flex items-start gap-2">
        <span class="px-1.5 py-0.5 rounded bg-black/40 text-[10px] font-black text-lime-400 shrink-0">${ev.minute}'</span>
        <p class="leading-snug">${ev.text}</p>
      </div>
    `;
  }).join('');
}

function updateLiveMatchTelemetryDOM() {
  const m = LIVE_MATCH;
  if (!m) return;
  const elClock = document.getElementById('live-clock');
  const elHS = document.getElementById('live-home-score');
  const elAS = document.getElementById('live-away-score');
  const elStats = document.getElementById('live-stats-strip');
  const elFeed = document.getElementById('live-event-feed');
  const elBanner = document.getElementById('live-goal-banner');

  if (elClock) elClock.textContent = `${Math.floor(m.minute)}' / 90'`;
  if (elHS) elHS.textContent = m.homeScore;
  if (elAS) elAS.textContent = m.awayScore;
  if (elStats) elStats.innerHTML = renderLiveStatsInner(m);
  if (elFeed) elFeed.innerHTML = renderLiveEventFeedInner(m);
  if (elBanner) {
    if (m.bannerAlert) {
      elBanner.classList.remove('hidden');
      elBanner.classList.add('flex');
      const bt = document.getElementById('banner-title');
      const bs = document.getElementById('banner-sub');
      if (bt) bt.textContent = m.bannerAlert.title;
      if (bs) bs.textContent = m.bannerAlert.sub;
    } else {
      elBanner.classList.add('hidden');
      elBanner.classList.remove('flex');
    }
  }
}

              : GAME_STATE.trophyCabinet.map(t => `
                  <div class="p-2.5 rounded-xl bg-amber-500/15 border border-amber-500/40 text-xs font-black text-amber-300">
                    🏆 ${t.title} — الموسم ${t.season} (${t.club})
                  </div>
                `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================================
   TAB 6: TRAINING CENTER, COACHING STAFF & YOUTH ACADEMY
   ============================================================================ */
function renderTrainingTab() {
  return `
    <div class="space-y-6 animate-slide-up">
      <!-- Youth Academy Section -->
      <div class="bg-white dark:bg-[#0d1424] border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-base sm:text-lg font-black">أكاديمية الشباب والكشافين (FC Youth Academy)</h2>
            <p class="text-xs text-slate-400">اكتشف المواهب الصاعدة وصعّدهم للفريق الأول لبناء مستقبل النادي وتحقيق أهداف الإدارة</p>
          </div>
          <button onclick="scoutNewYouthWave()"
            class="px-4 py-2 rounded-xl bg-gradient-to-l from-cyan-500 to-emerald-500 text-slate-950 text-xs font-black shadow">
            إرسال كشافين لمواهب جديدة (€2.5M)
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${GAME_STATE.youthAcademy.map(yp => `
            <div class="p-4 rounded-2xl bg-slate-100 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 flex flex-col justify-between gap-3">
              <div>
                <div class="flex items-center justify-between">
                  <span class="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 text-[10px] font-black">${yp.pos}</span>
                  <span class="text-xs font-black text-lime-400">POT ${yp.potential}</span>
                </div>
                <h4 class="text-sm font-black mt-2">${yp.name}</h4>
                <p class="text-[11px] text-slate-400">${yp.nationality} • ${yp.age} سنة • تقييم حالي: ${yp.ovr}</p>
              </div>
              <button onclick="promoteYouthProspect('${yp.prospect_id}')"
                class="w-full py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black transition">
                تصعيد للفريق الأول ⬆
              </button>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Coaching Staff -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${GAME_STATE.coaches.map(c => {
          const cost = Number((3.0 + c.level * 1.5).toFixed(1));
          return `
            <div class="bg-white dark:bg-[#0d1424] border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 flex flex-col justify-between gap-3">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-500/15 text-emerald-400">${c.title_ar}</span>
                  <h3 class="text-base font-black mt-1">${c.name}</h3>
                  <p class="text-xs text-slate-400 mt-1">${c.desc_ar}</p>
                </div>
                <div class="px-3 py-1.5 rounded-2xl bg-slate-900 border border-slate-700 text-center shrink-0">
                  <span class="text-[10px] text-slate-400 block">المستوى</span>
                  <span class="text-lg font-black text-lime-400">LV.${c.level}</span>
                </div>
              </div>
              <button onclick="trainCoach('${c.coach_id}')"
                class="w-full py-2.5 rounded-2xl bg-gradient-to-l from-emerald-500 to-teal-400 text-slate-950 font-black text-xs shadow">
                دورة تطوير تكتيكية (€${cost.toFixed(1)}M)
              </button>
            </div>
          `;
        }).join('')}
      </div>

      <!-- Individual Player Training -->
      <div class="bg-white dark:bg-[#0d1424] border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm sm:text-base font-black">التدريب الفردي المكثف للاعبين (+1 OVR لكل معسكر • €4.0M)</h3>
          <span class="text-xs text-slate-400 font-bold">جميع لاعبي الفريق (${GAME_STATE.roster.length})</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
          ${GAME_STATE.roster.map(inst => {
            const d = getInstanceFullData(inst.card_instance_id);
            if (!d) return '';
            const bonus = inst.training_bonus || 0;
            const isMaxed = bonus >= 10;
            return `
              <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  ${buildPortraitSVG(d.player, 40)}
                  <div class="min-w-0">
                    <div class="text-xs font-black truncate">${d.player.display_name}</div>
                    <div class="text-[10px] text-emerald-400 font-bold">${d.player.primary_position} • OVR ${d.ovr} (+${bonus}/10)</div>
                  </div>
                </div>
                <button onclick="trainSpecificPlayer('${inst.card_instance_id}')"
                  ${isMaxed ? 'disabled' : ''}
                  class="px-2.5 py-1.5 rounded-xl ${isMaxed ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-amber-500 text-slate-950'} text-[11px] font-black shrink-0">
                  ${isMaxed ? 'مكتمل' : 'تدريب +1'}
                </button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

/* ============================================================================
   TAB 7: MANAGER OFFICE, INBOX, TRANSFER LEDGER & CAREER RESET
   ============================================================================ */
function renderOfficeTab() {
  return `
    <div class="space-y-5 animate-slide-up">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <!-- Manager Inbox -->
        <div class="lg:col-span-7 bg-white dark:bg-[#0d1424] border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base sm:text-lg font-black">البريد الوارد وعروض الأندية (${GAME_STATE.inbox.length})</h2>
            <button onclick="GAME_STATE.inbox.forEach(m => m.read = true); persistState(); renderApp()"
              class="text-xs font-bold text-emerald-400 hover:underline">تحديد الكل كمقروء</button>
          </div>
          <div class="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
            ${GAME_STATE.inbox.map(mail => `
              <div onclick="mail.read=true; persistState()"
                class="p-3.5 rounded-2xl border ${mail.read ? 'bg-slate-100/70 dark:bg-slate-900/70 border-slate-800' : 'bg-emerald-950/30 border-emerald-500/40'} space-y-2">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="font-black text-emerald-400">${mail.from}</span>
                  <span class="text-slate-400">${mail.date}</span>
                </div>
                <div class="text-xs sm:text-sm font-black">${mail.subject}</div>
                <p class="text-xs text-slate-400 leading-relaxed">${mail.body}</p>
                ${mail.type === 'TRANSFER_OFFER' && mail.offerMeta && !mail.offerMeta.resolved ? `
                  <div class="flex gap-2 pt-1">
                    <button onclick="acceptIncomingOffer('${mail.id}')"
                      class="px-3.5 py-1.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black">
                      قبول العرض (+€${mail.offerMeta.fee}M)
                    </button>
                    <button onclick="mail.offerMeta.resolved=true; mail.read=true; persistState(); renderApp()"
                      class="px-3.5 py-1.5 rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/40 text-xs font-black">
                      رفض العرض
                    </button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Manager Profile & Career Controls -->
        <div class="lg:col-span-5 space-y-4">
          <div class="bg-white dark:bg-[#0d1424] border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 space-y-3">
            <h3 class="text-base font-black">ملف المدير الفني وإعدادات المسيرة</h3>
            <div class="p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900/90 space-y-1.5 text-xs">
              <div class="flex justify-between"><span>اسم المدرب:</span><strong>${GAME_STATE.manager.name}</strong></div>
              <div class="flex justify-between"><span>النادي الحالي:</span><strong>${GAME_STATE.club.name}</strong></div>
              <div class="flex justify-between"><span>المواسم التدريبية:</span><strong>${GAME_STATE.manager.seasonsManaged}</strong></div>
              <div class="flex justify-between"><span>البطولات المحققة:</span><strong class="text-amber-400">${GAME_STATE.manager.trophiesWon}</strong></div>
            </div>
            <button onclick="resetFullCareerMode()"
              class="w-full py-2.5 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 text-xs font-black">
              بدء مسيرة جديدة مع نادٍ آخر
            </button>
          </div>

          <div class="bg-white dark:bg-[#0d1424] border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 space-y-2.5">
            <h3 class="text-sm font-black">سجل الانتقالات الأخيرة</h3>
            <div class="space-y-1.5 max-h-56 overflow-y-auto text-xs">
              ${GAME_STATE.transferLedger.length === 0
                ? `<p class="text-slate-400">لا توجد صفقات مسجلة بعد.</p>`
                : GAME_STATE.transferLedger.map(tr => `
                    <div class="p-2 rounded-xl bg-slate-900/80 flex items-center justify-between">
                      <span>${tr.type === 'SELL' ? 'بيع' : (tr.type === 'LOAN' ? 'إعارة' : 'شراء')}: <strong>${tr.playerName}</strong></span>
                      <span class="${tr.type === 'SELL' ? 'text-emerald-400' : 'text-amber-400'} font-black">${tr.type === 'SELL' ? '+' : '-'}€${tr.amount}M</span>
                    </div>
                  `).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function resetFullCareerMode() {
  stopMatchLoop();
  LIVE_MATCH = null;
  GAME_STATE.careerStarted = false;
  GAME_STATE.roster = [];
  GAME_STATE.lineup = [];
  GAME_STATE.bench = [];
  try { localStorage.removeItem('UFM_V2_BACKUP'); } catch (e) {}
  renderApp();
}

/* ============================================================================
   9. BOOTSTRAP ON LOAD
   ============================================================================ */
window.addEventListener('DOMContentLoaded', () => {
  loadSavedState(() => {
    document.documentElement.classList.toggle('dark', GAME_STATE.theme === 'dark');
    document.documentElement.classList.toggle('light', GAME_STATE.theme !== 'dark');
    if (GAME_STATE.careerStarted && !GAME_STATE.currentOpponent) {
      generateNextFixtureOpponent();
    }
    renderApp();
  });
});
</script>
</body>
</html>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      overflow-x: hidden;
      user-select: none;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.45); }
    ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.5); border-radius: 999px; }

    /* FC-Inspired Geometric Card Frames */
    .card-standard {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 60%, #1e293b 100%);
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.65);
    }
    .card-pro {
      background: linear-gradient(145deg, #064e3b 0%, #022c22 45%, #0891b2 100%);
      border: 1.5px solid #34d399;
      box-shadow: 0 10px 26px -5px rgba(16, 185, 129, 0.45);
    }
    .card-icon {
      background: linear-gradient(145deg, #78350f 0%, #451a03 45%, #d97706 100%);
      border: 1.5px solid #fbbf24;
      box-shadow: 0 10px 28px -5px rgba(245, 158, 11, 0.5);
    }
    .light .card-standard {
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 65%, #e2e8f0 100%);
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
    }

    /* Tactical Pitch Styling */
    .tactical-pitch {
      background: repeating-linear-gradient(
        0deg,
        #0a4431 0px,
        #0a4431 36px,
        #0d523b 36px,
        #0d523b 72px
      );
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.65), 0 18px 40px -10px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }

    @keyframes goalFlash {
      0% { transform: scale(0.72); opacity: 0; }
      18% { transform: scale(1.06); opacity: 1; }
      85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    @keyframes slideUp {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-goal-banner { animation: goalFlash 3.4s ease-in-out forwards; }
    .pitch-token { transition: transform 0.12s ease, box-shadow 0.15s ease; }
    .pitch-token.dragging { z-index: 50; transform: translate(-50%, -50%) scale(1.14) !important; box-shadow: 0 0 25px rgba(16, 185, 129, 0.9); }

    #match-2d-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #06130e;
    }
    #match-2d-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const SKIN_TONES = ['#f8d5c2', '#f1c2a5', '#e0ac8b', '#c68663', '#a56846', '#7d4a30', '#593320', '#3d2215'];
const HAIR_COLORS = ['#111827', '#1f2937', '#3b2314', '#5c381e', '#78350f', '#b45309', '#d97706', '#9ca3af', '#e5e7eb'];

function getPlayerVisualDNA(player) {
  const seed = hashStr(`${player.player_id}_${player.en_name}_${player.nat}`);
  const rng = mulberry32(seed);
  let skinIdx = Math.floor(rng() * SKIN_TONES.length);
  if (['مصر', 'المغرب', 'السعودية', 'تونس', 'الجزائر'].includes(player.nat)) {
    skinIdx = 2 + Math.floor(rng() * 3);
  } else if (['نيجيريا', 'السنغال', 'الكاميرون', 'ساحل العاج', 'ليبيريا'].includes(player.nat)) {
    skinIdx = 5 + Math.floor(rng() * 3);
  } else if (['إنجلترا', 'ألمانيا', 'النرويج', 'هولندا', 'بولندا', 'السويد', 'كرواتيا'].includes(player.nat)) {
    skinIdx = Math.floor(rng() * 3);
  }
  const skin = SKIN_TONES[Math.min(SKIN_TONES.length - 1, skinIdx)];
  const hairCol = HAIR_COLORS[Math.floor(rng() * (player.age > 34 ? HAIR_COLORS.length : HAIR_COLORS.length - 2))];
  const jawW = 24 + Math.floor(rng() * 7);
  const jawH = 30 + Math.floor(rng() * 6);
  const hairStyle = Math.floor(rng() * 7);
  const hasBeard = player.age >= 21 && rng() > 0.42;
  const beardStyle = Math.floor(rng() * 3);
  const browTilt = (rng() - 0.5) * 4;
  const smileCurve = rng() > 0.35 ? 3.5 : -1.5;
  const eyeGap = 7.5 + rng() * 2.5;
  const bootColors = ['#10b981', '#f59e0b', '#38bdf8', '#f43f5e', '#ffffff', '#a3e635'];
  const bootCol = bootColors[player.player_id % bootColors.length];
  return { skin, hairCol, jawW, jawH, hairStyle, hasBeard, beardStyle, browTilt, smileCurve, eyeGap, bootCol };
}

function generateAttributesForPosition(pos, ovr, rng) {
  const jitter = () => Math.round((rng() - 0.5) * 6);
  const clamp = (v) => Math.max(45, Math.min(99, v));
  if (pos === 'GK') {
    return {
      reflexes: clamp(ovr + 2 + jitter()),
      handling: clamp(ovr + jitter()),
      positioning: clamp(ovr + 1 + jitter()),
      diving: clamp(ovr + 2 + jitter()),
      kicking: clamp(ovr - 4 + jitter()),
      speed: clamp(52 + jitter())
    };
  }
  const base = {
    pace: clamp(ovr - 4 + jitter()),
    shooting: clamp(ovr - 8 + jitter()),
    passing: clamp(ovr - 5 + jitter()),
    dribbling: clamp(ovr - 5 + jitter()),
    defending: clamp(ovr - 12 + jitter()),
    physical: clamp(ovr - 5 + jitter()),
    finishing: clamp(ovr - 8 + jitter()),
    positioning: clamp(ovr - 4 + jitter()),
    tackling: clamp(ovr - 10 + jitter()),
    marking: clamp(ovr - 10 + jitter()),
    interceptions: clamp(ovr - 10 + jitter()),
    vision: clamp(ovr - 6 + jitter()),
    ball_control: clamp(ovr - 3 + jitter()),
    crossing: clamp(ovr - 8 + jitter()),
    stamina: clamp(ovr - 2 + jitter()),
    agility: clamp(ovr - 4 + jitter()),
    heading: clamp(ovr - 8 + jitter())
  };
  if (pos === 'CB') {
    base.defending = clamp(ovr + 2 + jitter());
    base.tackling = clamp(ovr + 2 + jitter());
    base.marking = clamp(ovr + 2 + jitter());
    base.interceptions = clamp(ovr + 1 + jitter());
    base.physical = clamp(ovr + 3 + jitter());
    base.heading = clamp(ovr + 2 + jitter());
    base.shooting = clamp(52 + jitter());
  } else if (pos === 'RB' || pos === 'LB') {
    base.pace = clamp(ovr + 3 + jitter());
    base.stamina = clamp(ovr + 3 + jitter());
    base.crossing = clamp(ovr + 1 + jitter());
    base.tackling = clamp(ovr + jitter());
    base.defending = clamp(ovr - 1 + jitter());
  } else if (pos === 'CM') {
    base.passing = clamp(ovr + 3 + jitter());
    base.vision = clamp(ovr + 3 + jitter());
    base.ball_control = clamp(ovr + 2 + jitter());
    base.stamina = clamp(ovr + 2 + jitter());
    base.dribbling = clamp(ovr + 1 + jitter());
  } else if (pos === 'RW' || pos === 'LW') {
    base.pace = clamp(ovr + 4 + jitter());
    base.dribbling = clamp(ovr + 3 + jitter());
    base.agility = clamp(ovr + 3 + jitter());
    base.crossing = clamp(ovr + 1 + jitter());
    base.finishing = clamp(ovr + jitter());
  } else if (pos === 'ST') {
    base.finishing = clamp(ovr + 3 + jitter());
    base.shooting = clamp(ovr + 3 + jitter());
    base.positioning = clamp(ovr + 3 + jitter());
    base.heading = clamp(ovr + 1 + jitter());
    base.physical = clamp(ovr + 1 + jitter());
  }
  return base;
}

function calculateCardPrice(ovr) {
  const REF_99_PRICE = 24.0;
  if (ovr <= 99) {
    if (ovr >= 95) return Number((12 + (ovr - 95) * 3).toFixed(1));
    if (ovr >= 90) return Number((6.5 + (ovr - 90) * 1.1).toFixed(1));
    if (ovr >= 85) return Number((3.0 + (ovr - 85) * 0.7).toFixed(1));
    if (ovr >= 80) return Number((1.2 + (ovr - 80) * 0.35).toFixed(1));
    return Number((0.4 + Math.max(0, ovr - 70) * 0.08).toFixed(1));
  }
  if (ovr === 100) return REF_99_PRICE * 2;
  if (ovr === 101) return REF_99_PRICE * 4;
  if (ovr === 102) return REF_99_PRICE * 8;
  return REF_99_PRICE * 16;
}

(function init1000PlayersDatabase() {
  const usedNames = new Set();
  let nextId = 1;
  let count103 = 0;

  for (const s of VERIFIED_STARS) {
    if (usedNames.has(s.en)) continue;
    usedNames.add(s.en);

    const pid = nextId++;
    const rng = mulberry32(hashStr(s.en + pid));
    const stdOvr = Math.min(99, Math.max(75, s.base));
    let specialOvr = s.pro || null;
    if (specialOvr === 103) {
      if (count103 < 50) count103++;

    }

    const editions = [];

    const stdCard = {
      card_id: stdCardId,

      };
      editions.push(proCard);
      CARD_BY_ID.set(proCardId, proCard);
    }

    const potential = Math.min(99, Math.max(stdOvr, stdOvr + (s.age <= 24 ? 6 : (s.age <= 28 ? 2 : 0))));
    const weeklyWage = Number((stdCard.price * 0.0085 + 0.02).toFixed(3));

    const playerObj = {

  const posDistribution = ['GK', 'CB', 'CB', 'RB', 'LB', 'CM', 'CM', 'RW', 'LW', 'ST'];
  let genCursor = 0;

  while (PLAYER_CATALOG.length < 1000) {
    genCursor++;
    const reg = NAME_REGIONS[genCursor % NAME_REGIONS.length];
    const fIdx = (genCursor * 7 + Math.floor(genCursor / 13)) % reg.firstAr.length;
    const lIdx = (genCursor * 11 + Math.floor(genCursor / 7)) % reg.lastAr.length;

    const arFull = `${reg.firstAr[fIdx]} ${reg.lastAr[lIdx]}`;
    const enFull = `${reg.firstEn[fIdx]} ${reg.lastEn[lIdx]}`;
    if (usedNames.has(enFull)) continue;

    const pid = nextId++;

    let clubCandidates = REAL_CLUBS;
    if (reg.nat === 'مصر') clubCandidates = REAL_CLUBS.filter(c => c.country === 'مصر');

function initSeasonLeagueAndCompetitions(userClubId) {
  const leagueClubs = REAL_CLUBS.slice(0, 20).map(c => ({ ...c }));
  if (!leagueClubs.some(c => c.id === userClubId)) {
    const chosen = REAL_CLUBS.find(c => c.id === userClubId);
    if (chosen) leagueClubs[19] = { ...chosen };
  }

  GAME_STATE.leagueTable = leagueClubs.map(c => ({
    clubId: c.id,
    name: c.id === GAME_STATE.club.id ? GAME_STATE.club.name : c.name,
    short: c.short,
    c1: c.c1,
    c2: c.c2,
    tier: c.tier,
    p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
  }));

  const teamIds = GAME_STATE.leagueTable.map(t => t.clubId);
  const n = teamIds.length;
  const rounds = [];
  const rot = [...teamIds];

  for (let r = 0; r < (n - 1) * 2; r++) {
    const isSecondHalf = r >= (n - 1);
    const matches = [];
    for (let i = 0; i < n / 2; i++) {
      const t1 = rot[i];
      const t2 = rot[n - 1 - i];
      matches.push({
        homeId: isSecondHalf ? t2 : t1,
        awayId: isSecondHalf ? t1 : t2,
        played: false,
        homeGoals: null,
        awayGoals: null
      });
    }
    const compType = (r % 9 === 4) ? 'الكأس المحلي' : ((r % 7 === 3) ? 'البطولة القارية' : 'الدوري الممتاز');
    rounds.push({ round: r + 1, competition: compType, matches });
    const last = rot.pop();
    rot.splice(1, 0, last);
  }

  GAME_STATE.leagueFixtures = rounds;
}

    { pos: 'RW', targetOvr: club.tier - 1 },
    { pos: 'ST', targetOvr: club.tier },

  const usedPids = new Set();
  const roster = [];

  starterSpecs.forEach((spec, idx) => {
    let candidate = clubStars.find(p => !usedPids.has(p.player_id) && p.primary_position === spec.pos);
    if (!candidate) {
      candidate = PLAYER_CATALOG.find(p =>
        !p.is_retired &&
        !usedPids.has(p.player_id) &&
        p.primary_position === spec.pos &&
        Math.abs(p.editions[0].base_rating - spec.targetOvr) <= 3
      );
    }
    if (!candidate) {
      candidate = PLAYER_CATALOG.find(p => !p.is_retired && !usedPids.has(p.player_id) && p.primary_position === spec.pos);
    }

    usedPids.add(candidate.player_id);
    const stdCard = candidate.editions[0];
    const instId = `inst_${candidate.player_id}_${idx + 1}`;

      card_instance_id: instId,

const DB_NAME = 'UFM_V2_DB';
const STORE_NAME = 'saves';

function saveToIndexedDB(stateObj) {
  try {
    localStorage.setItem('UFM_V2_BACKUP', JSON.stringify(stateObj));
  } catch (e) {}
  if (!window.indexedDB) return;
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
  };
  req.onsuccess = (e) => {
    try {
      const db = e.target.result;
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(stateObj, 'primary_save');
    } catch (err) {}
  };
}

function loadSavedState(callback) {
  let resolved = false;
  const finish = (data) => {
    if (resolved) return;
    resolved = true;
    if (data && Array.isArray(data.roster) && data.roster.length > 0) {
      GAME_STATE = {
        ...GAME_STATE,
        ...data,
        careerStarted: true,
        manager: { ...GAME_STATE.manager, ...(data.manager || {}) },
        club: { ...GAME_STATE.club, ...(data.club || {}) },
        tactics: { ...GAME_STATE.tactics, ...(data.tactics || {}) }
      };
      GAME_STATE.roster.forEach((r, idx) => {
        if (r.contract_years === undefined) r.contract_years = 2 + (idx % 3);
        if (r.weekly_wage === undefined) {
          const p = PLAYER_BY_ID.get(r.player_id);
          r.weekly_wage = p ? p.weekly_wage : 0.05;
        }
        if (r.morale === undefined) r.morale = 85;
        if (r.injury_rounds === undefined) r.injury_rounds = 0;
        if (r.suspension_rounds === undefined) r.suspension_rounds = 0;
      });
      if (!GAME_STATE.leagueTable || GAME_STATE.leagueTable.length === 0) {
        initSeasonLeagueAndCompetitions(GAME_STATE.club.id || 'ahl');
      }
      if (!GAME_STATE.youthAcademy || GAME_STATE.youthAcademy.length === 0) {
        generateInitialYouthProspects();
      }
      sanitizeLineupAndBench();
    }
    callback();
  };

  if (window.indexedDB) {
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = (e) => {
        const db = e.target.result;
        const tx = db.transaction(STORE_NAME, 'readonly');
        const getReq = tx.objectStore(STORE_NAME).get('primary_save');
        getReq.onsuccess = () => {
          if (getReq.result) finish(getReq.result);
          else {
            const ls = localStorage.getItem('UFM_V2_BACKUP');
            finish(ls ? JSON.parse(ls) : null);
          }
        };
        getReq.onerror = () => {
          const ls = localStorage.getItem('UFM_V2_BACKUP');
          finish(ls ? JSON.parse(ls) : null);
        };
      };
      req.onerror = () => {
        const ls = localStorage.getItem('UFM_V2_BACKUP');
        finish(ls ? JSON.parse(ls) : null);
      };
    } catch (err) {
      const ls = localStorage.getItem('UFM_V2_BACKUP');
      finish(ls ? JSON.parse(ls) : null);
    }
  } else {
    const ls = localStorage.getItem('UFM_V2_BACKUP');
    finish(ls ? JSON.parse(ls) : null);
  }
}

function sanitizeLineupAndBench() {
  const validIds = new Set(GAME_STATE.roster.map(r => r.card_instance_id));
  const used = new Set();
  GAME_STATE.lineup = (GAME_STATE.lineup || []).filter(slot => {
    if (!slot || !slot.instance_id || !validIds.has(slot.instance_id) || used.has(slot.instance_id)) return false;
    used.add(slot.instance_id);
    return true;
  });
  GAME_STATE.bench = (GAME_STATE.bench || []).filter(bId => {
    if (!bId || !validIds.has(bId) || used.has(bId)) return false;
    used.add(bId);
    return true;
  }).slice(0, MAX_BENCH);
}

function persistState() {
  saveToIndexedDB(GAME_STATE);
  updateTopTelemetry();
}

/* ============================================================================
   3. OVR CALCULATIONS, POSITIONAL ENGINE & SMART AUTO LINEUP
   ============================================================================ */
function getInstanceEffectiveOVR(inst) {
  if (!inst) return 0;
  const maxCap = inst.base_rating === 103 ? 117 : (inst.base_rating + 14);
  return Math.min(maxCap, inst.base_rating + (inst.goal_bonus || 0) + (inst.training_bonus || 0));
}

function getInstanceFullData(instId) {
  const inst = GAME_STATE.roster.find(r => r.card_instance_id === instId);
  if (!inst) return null;
  const player = PLAYER_BY_ID.get(inst.player_id);
  const card = CARD_BY_ID.get(inst.card_id);
  if (!player || !card) return null;
  return {
    inst,
    player,
    card,
    ovr: getInstanceEffectiveOVR(inst)
  };
}

function inferPitchZonePosition(x, y) {
  if (y >= 82) return 'GK';
  if (y >= 64) {
    if (x >= 72) return 'RB';
    if (x <= 28) return 'LB';
    return 'CB';
  }
  if (y >= 40) {
    if (x >= 76) return 'RW';
    if (x <= 24) return 'LW';
    return 'CM';
  }
  if (x >= 68) return 'RW';
  if (x <= 32) return 'LW';
  return 'ST';
}

function getPositionalFit(player, zonePos) {
  if (zonePos === 'GK') return player.primary_position === 'GK' ? 1.0 : 0.42;
  if (player.primary_position === 'GK') return 0.45;
  if (player.primary_position === zonePos) return 1.0;
  if (player.secondary_positions && player.secondary_positions.includes(zonePos)) return 0.96;
  if (ADJACENT_POSITIONS[player.primary_position]?.includes(zonePos)) return 0.89;
  return 0.72;
}

function applySmartAutoLineup() {
  if (LIVE_MATCH && !LIVE_MATCH.finished) {
    showToast('لا يمكن تغيير التشكيلة التلقائية أثناء سير المباراة!', 'error');
    return;
  }
  if (!GAME_STATE.roster || GAME_STATE.roster.length === 0) return;

  AUTO_LINEUP_UNDO_SNAPSHOT = {
    lineup: JSON.parse(JSON.stringify(GAME_STATE.lineup)),
    bench: [...GAME_STATE.bench]
  };

  const uniqueOwned = [];
  const seenInst = new Set();
  for (const inst of GAME_STATE.roster) {
    if (seenInst.has(inst.card_instance_id)) continue;
    if ((inst.injury_rounds || 0) > 0 || (inst.suspension_rounds || 0) > 0 || inst.is_loaned_out) continue;
    const full = getInstanceFullData(inst.card_instance_id);
    if (!full) continue;
    seenInst.add(inst.card_instance_id);
    uniqueOwned.push(full);
  }

  const baseSlots = (GAME_STATE.lineup && GAME_STATE.lineup.length === 11)
    ? GAME_STATE.lineup.map((s, idx) => ({
        slot_idx: idx,
        x: s.x,
        y: s.y,
        zonePos: inferPitchZonePosition(s.x, s.y)
      }))
    : FORMATIONS['4-3-3'].map((s, idx) => ({
        slot_idx: idx,
        x: s.x,
        y: s.y,
        zonePos: s.pos
      }));

  function scorePlayerForSlot(d, zonePos) {
    const { player, card, ovr } = d;
    const isGKSlot = (zonePos === 'GK');
    const isGKPlayer = (player.primary_position === 'GK');
    if (isGKSlot && !isGKPlayer) return -10000 + ovr;
    if (!isGKSlot && isGKPlayer) return -10000 + ovr;

    const fit = getPositionalFit(player, zonePos);
    if (fit < 0.85) return -2000 + ovr * fit;

    let posTierBonus = 0;
    if (player.primary_position === zonePos) posTierBonus = 28;
    else if (player.secondary_positions && player.secondary_positions.includes(zonePos)) posTierBonus = 18;
    else if (ADJACENT_POSITIONS[player.primary_position]?.includes(zonePos)) posTierBonus = 8;

    const a = card.attributes || {};
    let attrBonus = 0;
    if (zonePos === 'GK') attrBonus = ((a.reflexes || ovr) + (a.positioning || ovr) + (a.diving || ovr)) / 30;
    else if (zonePos === 'CB') attrBonus = ((a.defending || ovr) + (a.tackling || ovr) + (a.physical || ovr)) / 30;
    else if (zonePos === 'RB' || zonePos === 'LB') attrBonus = ((a.pace || ovr) + (a.tackling || ovr) + (a.crossing || ovr)) / 30;
    else if (zonePos === 'CM') attrBonus = ((a.passing || ovr) + (a.vision || ovr) + (a.ball_control || ovr)) / 30;
    else if (zonePos === 'RW' || zonePos === 'LW') attrBonus = ((a.pace || ovr) + (a.dribbling || ovr) + (a.crossing || ovr)) / 30;
    else if (zonePos === 'ST') attrBonus = ((a.finishing || ovr) + (a.shooting || ovr) + (a.positioning || ovr)) / 30;

    return (ovr * fit) + posTierBonus + attrBonus;
  }

  const slotPriorityOrder = baseSlots
    .map((slot, idx) => {
      const naturalCount = uniqueOwned.filter(d => d.player.primary_position === slot.zonePos).length;
      return { ...slot, origIdx: idx, scarcity: naturalCount };
    })
    .sort((a, b) => a.scarcity - b.scarcity);

  const assignedInstanceIds = new Set();
  const newLineupSlots = new Array(baseSlots.length);

  for (const slot of slotPriorityOrder) {
    let bestCandidate = null;
    let bestScore = -Infinity;
    for (const d of uniqueOwned) {
      if (assignedInstanceIds.has(d.inst.card_instance_id)) continue;
      const sc = scorePlayerForSlot(d, slot.zonePos);
      if (sc > bestScore) {
        bestScore = sc;
        bestCandidate = d;
      }
    }
    if (bestCandidate) {
      assignedInstanceIds.add(bestCandidate.inst.card_instance_id);
      newLineupSlots[slot.origIdx] = {
        slot_idx: slot.origIdx,
        instance_id: bestCandidate.inst.card_instance_id,
        x: slot.x,
        y: slot.y,
        expected_pos: slot.zonePos
      };
    }
  }

  GAME_STATE.lineup = newLineupSlots.filter(Boolean);

  const remainingPlayers = uniqueOwned
    .filter(d => !assignedInstanceIds.has(d.inst.card_instance_id))
    .sort((a, b) => b.ovr - a.ovr);

  const newBench = [];
  const lineQuotas = [
    { line: 'GK', count: 1 },
    { line: 'DEF', count: 3 },
    { line: 'MID', count: 3 },
    { line: 'ATT', count: 3 }
  ];

  for (const q of lineQuotas) {
    let picked = 0;
    for (const d of remainingPlayers) {
      if (picked >= q.count || newBench.length >= MAX_BENCH) break;
      if (assignedInstanceIds.has(d.inst.card_instance_id)) continue;
      if (POS_LINE[d.player.primary_position] === q.line) {
        assignedInstanceIds.add(d.inst.card_instance_id);
        newBench.push(d.inst.card_instance_id);
        picked++;
      }
    }
  }

  for (const d of remainingPlayers) {
    if (newBench.length >= MAX_BENCH) break;
    if (assignedInstanceIds.has(d.inst.card_instance_id)) continue;
    assignedInstanceIds.add(d.inst.card_instance_id);
    newBench.push(d.inst.card_instance_id);
  }

  GAME_STATE.bench = newBench;
  selectedStarterSlotIdx = null;
  persistState();
  showToast(`تم ضبط أفضل تشكيلة تلقائية (${GAME_STATE.lineup.length} أساسيين + ${GAME_STATE.bench.length} احتياط)!`, 'success');
  renderApp();
}

function undoSmartAutoLineup() {
  if (!AUTO_LINEUP_UNDO_SNAPSHOT) return;
  GAME_STATE.lineup = JSON.parse(JSON.stringify(AUTO_LINEUP_UNDO_SNAPSHOT.lineup));
  GAME_STATE.bench = [...AUTO_LINEUP_UNDO_SNAPSHOT.bench];
  AUTO_LINEUP_UNDO_SNAPSHOT = null;
  selectedStarterSlotIdx = null;
  persistState();
  showToast('تم التراجع واستعادة التشكيلة السابقة بنجاح', 'info');
  renderApp();
}

function calculateSquadOVR() {
  if (!GAME_STATE.roster || GAME_STATE.roster.length === 0) return 0.0;
  const seenIds = new Set();
  let sum = 0, count = 0;
  for (const inst of GAME_STATE.roster) {
    if (seenIds.has(inst.card_instance_id)) continue;
    seenIds.add(inst.card_instance_id);
    sum += getInstanceEffectiveOVR(inst);
    count++;
  }
  return count === 0 ? 0.0 : Number((sum / count).toFixed(1));
}

function calculateMatchOVR() {
  if (!GAME_STATE.lineup || GAME_STATE.lineup.length === 0) return 0.0;
  const seenIds = new Set();
  let sum = 0, count = 0;
  for (const slot of GAME_STATE.lineup) {
    if (!slot.instance_id || seenIds.has(slot.instance_id)) continue;
    const data = getInstanceFullData(slot.instance_id);
    if (!data) continue;
    seenIds.add(slot.instance_id);
    sum += data.ovr;
    count++;
  }
  return count === 0 ? 0.0 : Number((sum / count).toFixed(1));
}

function evaluateTeamTacticalProfile(startersList, tacticsObj, coaches = []) {
  const playStyle = typeof tacticsObj === 'string' ? tacticsObj : (tacticsObj.playStyle || 'balanced');
  const press = typeof tacticsObj === 'object' ? (tacticsObj.defensivePress || 'balanced') : 'balanced';

  const coachMap = { DEFENCE: 1, ATTACK: 1, MIDFIELD: 1, GOALKEEPER: 1 };
  coaches.forEach(c => { coachMap[c.specialty] = c.level || 1; });

  let attSum = 0, attCount = 0;
  let midSum = 0, midCount = 0;
  let defSum = 0, defCount = 0;
  let gkScore = 50;
  let fitSum = 0;
  let hasRealGK = false;
  const outOfPosList = [];

  startersList.forEach(item => {
    const { player, card, ovr, zonePos } = item;
    const fit = getPositionalFit(player, zonePos);
    fitSum += fit;
    if (fit < 0.92) outOfPosList.push({ name: player.display_name, realPos: player.primary_position, zonePos, fit });

    const attrs = card.attributes;
    const effOvr = ovr * fit;

    if (zonePos === 'GK') {
      hasRealGK = (player.primary_position === 'GK');
      const gkAttr = attrs.reflexes ? (attrs.reflexes + attrs.positioning + attrs.handling + attrs.diving) / 4 : effOvr;
      gkScore = ((effOvr * 0.55 + gkAttr * 0.45) * (1 + (coachMap.GOALKEEPER - 1) * 0.018));
    } else if (POS_LINE[zonePos] === 'DEF') {
      const defAttr = attrs.tackling ? (attrs.tackling + attrs.marking + attrs.interceptions + attrs.physical) / 4 : effOvr;
      defSum += (effOvr * 0.55 + defAttr * 0.45);
      defCount++;
    } else if (POS_LINE[zonePos] === 'MID') {
      const midAttr = attrs.passing ? (attrs.passing + attrs.vision + attrs.ball_control + attrs.stamina) / 4 : effOvr;
      midSum += (effOvr * 0.55 + midAttr * 0.45);
      midCount++;
    } else {
      const attAttr = attrs.finishing ? (attrs.finishing + attrs.pace + attrs.dribbling + attrs.positioning) / 4 : effOvr;
      attSum += (effOvr * 0.55 + attAttr * 0.45);
      attCount++;
    }
  });

  const coachDefMult = 1 + (coachMap.DEFENCE - 1) * 0.018;
  const coachAttMult = 1 + (coachMap.ATTACK - 1) * 0.018;
  const coachMidMult = 1 + (coachMap.MIDFIELD - 1) * 0.018;

  let styleAttMod = 1.0, styleDefMod = 1.0, styleMidMod = 1.0, counterVulnerability = 1.0;
  if (playStyle === 'attacking') {
    styleAttMod = 1.09;
    styleMidMod = 1.03;
    styleDefMod = 0.89;
    counterVulnerability = 1.24;
  } else if (playStyle === 'defensive') {
    styleAttMod = 0.88;
    styleMidMod = 0.98;
    styleDefMod = 1.11;
    counterVulnerability = 0.82;
  }

  if (press === 'high') {
    styleMidMod += 0.03;
    counterVulnerability += 0.1;
  } else if (press === 'low') {
    styleDefMod += 0.04;
    counterVulnerability -= 0.08;
  }

  const attackStrength = Number(((attCount ? attSum / attCount : 65) * coachAttMult * styleAttMod).toFixed(1));
  const midfieldStrength = Number(((midCount ? midSum / midCount : 65) * coachMidMult * styleMidMod).toFixed(1));
  const defenseStrength = Number(((defCount ? defSum / defCount : 65) * coachDefMult * styleDefMod).toFixed(1));
  const goalkeeperStrength = Number(gkScore.toFixed(1));
  const avgFit = startersList.length ? fitSum / startersList.length : 0.7;

  return {
    attackStrength,
    midfieldStrength,
    defenseStrength,
    goalkeeperStrength,
    avgFit: Number((avgFit * 100).toFixed(0)),
    hasRealGK,
    outOfPosList,
    counterVulnerability,
    effectiveOverall: Number((((attackStrength + midfieldStrength + defenseStrength + goalkeeperStrength) / 4)).toFixed(1))
  };
}

/* ============================================================================
   4. SEASON FIXTURE OPPONENT & WORLD SIMULATION ENGINE
   ============================================================================ */
function generateNextFixtureOpponent() {
  const roundIdx = Math.min(GAME_STATE.leagueFixtures.length - 1, Math.max(0, GAME_STATE.club.round - 1));
  const roundObj = GAME_STATE.leagueFixtures[roundIdx];
  let oppClub = null;
  let competitionName = roundObj ? roundObj.competition : 'الدوري الممتاز';

  if (roundObj) {
    const userMatch = roundObj.matches.find(m => m.homeId === GAME_STATE.club.id || m.awayId === GAME_STATE.club.id);
    if (userMatch) {
      const oppId = userMatch.homeId === GAME_STATE.club.id ? userMatch.awayId : userMatch.homeId;
      oppClub = REAL_CLUBS.find(c => c.id === oppId);
    }
  }
  if (!oppClub) {
    const others = REAL_CLUBS.filter(c => c.id !== GAME_STATE.club.id);
    oppClub = others[GAME_STATE.club.round % others.length];
  }

  const targetOVR = oppClub.tier;
  const formKeys = Object.keys(FORMATIONS);
  const formName = formKeys[hashStr(oppClub.id + GAME_STATE.club.round) % formKeys.length];
  const formSlots = FORMATIONS[formName];
  const oppStyles = ['attacking', 'balanced', 'defensive'];
  const oppPlayStyle = oppStyles[hashStr(oppClub.en) % oppStyles.length];

  const usedPlayerIds = new Set();
  const starters = [];
  const clubRealPlayers = PLAYER_CATALOG.filter(p => !p.is_retired && p.real_club === oppClub.name);

  formSlots.forEach((slot, idx) => {
    let bestPick = null;
    const realMatch = clubRealPlayers.find(p => !usedPlayerIds.has(p.player_id) && p.primary_position === slot.pos);
    if (realMatch) {
      bestPick = { player: realMatch, card: realMatch.editions[0], ovr: realMatch.editions[0].base_rating };
    } else {
      const candidates = PLAYER_CATALOG.filter(p => !usedPlayerIds.has(p.player_id) && p.primary_position === slot.pos);
      let bestDiff = 999;
      for (let i = 0; i < 45; i++) {
        const p = candidates[Math.floor(Math.random() * candidates.length)];
        if (!p) continue;
        const ed = p.editions[0];
        const diff = Math.abs(ed.base_rating - targetOVR);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestPick = { player: p, card: ed, ovr: ed.base_rating };
        }
      }
      if (!bestPick && candidates[0]) {
        bestPick = { player: candidates[0], card: candidates[0].editions[0], ovr: candidates[0].editions[0].base_rating };
      }
    }

    usedPlayerIds.add(bestPick.player.player_id);
    starters.push({
      slot_idx: idx,
      player_id: bestPick.player.player_id,
      card_id: bestPick.card.card_id,
      ovr: bestPick.ovr,
      x: slot.x,
      y: slot.y,
      zonePos: slot.pos
    });
  });

  const oppMatchOVR = Number((starters.reduce((s, x) => s + x.ovr, 0) / starters.length).toFixed(1));

  GAME_STATE.currentOpponent = {
    id: `opp_${Date.now()}`,
    club: oppClub,
    competition: competitionName,
    tierLabel: `${competitionName} • الجولة ${GAME_STATE.club.round}`,
    formation: formName,
    playStyle: oppPlayStyle,
    matchOVR: oppMatchOVR,
    starters
  };
  persistState();
  return GAME_STATE.currentOpponent;
}

function simulateLeagueRoundWithUserResult(userHomeGoals, userAwayGoals) {
  const roundIdx = Math.min(GAME_STATE.leagueFixtures.length - 1, Math.max(0, GAME_STATE.club.round - 1));
  const roundObj = GAME_STATE.leagueFixtures[roundIdx];
  if (!roundObj) return;

  const findRow = (id) => GAME_STATE.leagueTable.find(t => t.clubId === id);

  roundObj.matches.forEach(m => {
    if (m.played) return;
    const hRow = findRow(m.homeId);
    const aRow = findRow(m.awayId);
    if (!hRow || !aRow) return;

    let hg = 0, ag = 0;
    if (m.homeId === GAME_STATE.club.id) {
      hg = userHomeGoals;
      ag = userAwayGoals;
    } else if (m.awayId === GAME_STATE.club.id) {
      hg = userAwayGoals;
      ag = userHomeGoals;
    } else {
      const diff = (hRow.tier - aRow.tier + 2) * 0.08;
      hg = Math.max(0, Math.round(Math.random() * 2.4 + diff));
      ag = Math.max(0, Math.round(Math.random() * 2.1 - diff * 0.6));
    }

    m.played = true;
    m.homeGoals = hg;
    m.awayGoals = ag;

    hRow.p += 1; aRow.p += 1;
    hRow.gf += hg; hRow.ga += ag; hRow.gd = hRow.gf - hRow.ga;
    aRow.gf += ag; aRow.ga += hg; aRow.gd = aRow.gf - aRow.ga;

    if (hg > ag) { hRow.w += 1; hRow.pts += 3; aRow.l += 1; }
    else if (hg < ag) { aRow.w += 1; aRow.pts += 3; hRow.l += 1; }
    else { hRow.d += 1; hRow.pts += 1; aRow.d += 1; aRow.pts += 1; }
  });

  GAME_STATE.leagueTable.sort((a, b) => (b.pts - a.pts) || (b.gd - a.gd) || (b.gf - a.gf));
}

/* ============================================================================
   5. HIGH-QUALITY 2D BROADCAST STADIUM RENDERER (HTML5 CANVAS 60FPS)
   ============================================================================ */
let MATCH_2D_CTX = null;

function init2DBroadcastPitch(canvasEl) {
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  MATCH_2D_CTX = {
    canvas: canvasEl,
    ctx,
    viewMode: MATCH_2D_CTX?.viewMode || 'FULL_TV',
    camX: 50,
    camY: 50,
    camZoom: 1.0,
    pitchBuffer: null
  };
  resize2DMatchCanvas();
}

function resize2DMatchCanvas() {
  if (!MATCH_2D_CTX || !MATCH_2D_CTX.canvas) return;
  const canvas = MATCH_2D_CTX.canvas;
  const rect = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : { width: 800, height: 520 };
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(320, Math.floor(rect.width));
  const h = Math.max(240, Math.floor(rect.height));

  if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    MATCH_2D_CTX.pitchBuffer = null;
  }
}

window.addEventListener('resize', () => {
  if (GAME_STATE.activeTab === 'match' && LIVE_MATCH) {
    resize2DMatchCanvas();
  }
});

function buildOffscreen2DPitchBuffer(width, height) {
  const buf = document.createElement('canvas');
  buf.width = width;
  buf.height = height;
  const c = buf.getContext('2d');

  const outerGrad = c.createRadialGradient(width * 0.5, height * 0.5, width * 0.1, width * 0.5, height * 0.5, width * 0.75);
  outerGrad.addColorStop(0, '#0c3b29');
  outerGrad.addColorStop(1, '#04120d');
  c.fillStyle = outerGrad;
  c.fillRect(0, 0, width, height);

  const padX = width * 0.055;
  const padY = height * 0.065;
  const fieldW = width - padX * 2;
  const fieldH = height - padY * 2;

  const stripes = 16;
  const stripeW = fieldW / stripes;
  for (let i = 0; i < stripes; i++) {
    c.fillStyle = i % 2 === 0 ? '#0d5e3f' : '#116e4a';
    c.fillRect(padX + i * stripeW, padY, stripeW + 0.5, fieldH);
  }

  const lightGrad = c.createRadialGradient(width * 0.5, height * 0.5, fieldW * 0.15, width * 0.5, height * 0.5, fieldW * 0.65);
  lightGrad.addColorStop(0, 'rgba(255,255,255,0.06)');
  lightGrad.addColorStop(1, 'rgba(0,0,0,0.22)');
  c.fillStyle = lightGrad;
  c.fillRect(padX, padY, fieldW, fieldH);

  c.strokeStyle = 'rgba(255, 255, 255, 0.88)';
  c.lineWidth = Math.max(1.6, width * 0.0024);
  c.strokeRect(padX, padY, fieldW, fieldH);

  const midX = padX + fieldW * 0.5;
  const midY = padY + fieldH * 0.5;
  c.beginPath();
  c.moveTo(midX, padY);
  c.lineTo(midX, padY + fieldH);
  c.stroke();

  const centerR = Math.min(fieldW, fieldH) * 0.145;
  c.beginPath();
  c.arc(midX, midY, centerR, 0, Math.PI * 2);
  c.stroke();

  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(midX, midY, Math.max(2.5, width * 0.004), 0, Math.PI * 2);
  c.fill();

  const penW = fieldW * 0.155;
  const penH = fieldH * 0.56;
  const penY = padY + (fieldH - penH) * 0.5;
  c.strokeRect(padX, penY, penW, penH);
  c.strokeRect(padX + fieldW - penW, penY, penW, penH);

  const sixW = fieldW * 0.055;
  const sixH = fieldH * 0.26;
  const sixY = padY + (fieldH - sixH) * 0.5;
  c.strokeRect(padX, sixY, sixW, sixH);
  c.strokeRect(padX + fieldW - sixW, sixY, sixW, sixH);

  const penSpotDist = fieldW * 0.105;
  c.beginPath(); c.arc(padX + penSpotDist, midY, 2.5, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(padX + fieldW - penSpotDist, midY, 2.5, 0, Math.PI * 2); c.fill();

  c.beginPath();
  c.arc(padX + penSpotDist, midY, centerR * 0.85, -0.92, 0.92);
  c.stroke();
  c.beginPath();
  c.arc(padX + fieldW - penSpotDist, midY, centerR * 0.85, Math.PI - 0.92, Math.PI + 0.92);
  c.stroke();

  const cornerR = Math.min(fieldW, fieldH) * 0.024;
  c.beginPath(); c.arc(padX, padY, cornerR, 0, Math.PI * 0.5); c.stroke();
  c.beginPath(); c.arc(padX + fieldW, padY, cornerR, Math.PI * 0.5, Math.PI); c.stroke();
  c.beginPath(); c.arc(padX, padY + fieldH, cornerR, -Math.PI * 0.5, 0); c.stroke();
  c.beginPath(); c.arc(padX + fieldW, padY + fieldH, cornerR, Math.PI, Math.PI * 1.5); c.stroke();

  const goalH = fieldH * 0.15;
  const goalD = padX * 0.58;
  const goalY = midY - goalH * 0.5;

  c.fillStyle = 'rgba(255, 255, 255, 0.18)';
  c.strokeStyle = '#ffffff';
  c.lineWidth = Math.max(2, width * 0.003);
  c.fillRect(padX - goalD, goalY, goalD, goalH);
  c.strokeRect(padX - goalD, goalY, goalD, goalH);
  c.fillRect(padX + fieldW, goalY, goalD, goalH);
  c.strokeRect(padX + fieldW, goalY, goalD, goalH);

  return buf;
}

function mapLogicalTo2DCanvas(pctX, pctY, width, height) {
  const padX = width * 0.055;
  const padY = height * 0.065;
  const fieldW = width - padX * 2;
  const fieldH = height - padY * 2;
  const sx = padX + ((100 - pctY) / 100) * fieldW;
  const sy = padY + (pctX / 100) * fieldH;
  return { sx, sy };
}

function set2DCameraMode(mode) {
  if (!MATCH_2D_CTX) return;
  MATCH_2D_CTX.viewMode = mode;
  showToast(mode === 'ACTION_ZOOM' ? 'كاميرا التتبع الديناميكي (Action Zoom)' : 'كاميرا الملعب الكامل (Full Broadcast)', 'info');
}

function render2DMatchFrame(dt, nowMs) {
  const m = LIVE_MATCH;
  if (!m || !MATCH_2D_CTX || !MATCH_2D_CTX.canvas || !MATCH_2D_CTX.ctx) return;

  resize2DMatchCanvas();
  const { canvas, ctx } = MATCH_2D_CTX;
  const W = canvas.width;
  const H = canvas.height;
  if (W <= 0 || H <= 0) return;

  if (!MATCH_2D_CTX.pitchBuffer) {
    MATCH_2D_CTX.pitchBuffer = buildOffscreen2DPitchBuffer(W, H);
  }

  ctx.save();

  const targetZoom = MATCH_2D_CTX.viewMode === 'ACTION_ZOOM' ? 1.26 : 1.0;
  MATCH_2D_CTX.camZoom += (targetZoom - MATCH_2D_CTX.camZoom) * Math.min(1, dt * 4.5);

  const ballScreen = mapLogicalTo2DCanvas(m.ballX, m.ballY, W, H);
  MATCH_2D_CTX.camX += (ballScreen.sx - MATCH_2D_CTX.camX) * Math.min(1, dt * 4.0);
  MATCH_2D_CTX.camY += (ballScreen.sy - MATCH_2D_CTX.camY) * Math.min(1, dt * 4.0);

  if (MATCH_2D_CTX.camZoom > 1.005) {
    const z = MATCH_2D_CTX.camZoom;
    const offsetX = Math.max(W - W * z, Math.min(0, W * 0.5 - MATCH_2D_CTX.camX * z));
    const offsetY = Math.max(H - H * z, Math.min(0, H * 0.5 - MATCH_2D_CTX.camY * z));
    ctx.translate(offsetX, offsetY);
    ctx.scale(z, z);
  }

  ctx.drawImage(MATCH_2D_CTX.pitchBuffer, 0, 0);

  const ballSpeed = Math.hypot(m.ballVx || 0, m.ballVy || 0);
  if (m.ballInFlight && ballSpeed > 10) {
    const startScreen = mapLogicalTo2DCanvas(m.ballStartX, m.ballStartY, W, H);
    const grad = ctx.createLinearGradient(startScreen.sx, startScreen.sy, ballScreen.sx, ballScreen.sy);
    const isShot = m.ballActionType === 'SHOT';
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, isShot ? 'rgba(244, 63, 94, 0.85)' : 'rgba(250, 204, 21, 0.78)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = Math.max(2.2, W * 0.0032);
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(startScreen.sx, startScreen.sy);
    ctx.lineTo(ballScreen.sx, ballScreen.sy);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  const allRenderPlayers = [
    ...m.homePlayers.filter(p => !p.redCard).map(p => ({ p, isHome: true })),
    ...m.awayPlayers.filter(p => !p.redCard).map(p => ({ p, isHome: false }))
  ].sort((a, b) => a.p.currX - b.p.currX);

  const playerRadius = Math.max(10, Math.min(16, W * 0.0155));

  for (const { p, isHome } of allRenderPlayers) {
    const pos = mapLogicalTo2DCanvas(p.currX, p.currY, W, H);
    const isCarrier = (p.uid === m.ballOwnerUid && !m.ballInFlight);
    const isGK = p.zonePos === 'GK';

    const c1 = isGK ? '#a3e635' : (isHome ? GAME_STATE.club.c1 : m.opponent.club.c1);
    const c2 = isGK ? '#064e3b' : (isHome ? GAME_STATE.club.c2 : m.opponent.club.c2);
    const dna = p.dna || { skin: '#e0ac8b', hairCol: '#111827', hasBeard: false };

    if (isCarrier) {
      const pulseR = playerRadius * (1.42 + Math.sin(nowMs * 0.012) * 0.14);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(pos.sx, pos.sy, pulseR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(251, 191, 36, 0.18)';
      ctx.beginPath();
      ctx.arc(pos.sx, pos.sy, pulseR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
    ctx.beginPath();
    ctx.ellipse(pos.sx, pos.sy + playerRadius * 0.88, playerRadius * 0.85, playerRadius * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    const moveSpeed = Math.hypot(p.vx || 0, p.vy || 0);
    if (moveSpeed > 1.5) {
      const stride = Math.sin(nowMs * 0.02 + p.player_id) * (playerRadius * 0.35);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(pos.sx - playerRadius * 0.35, pos.sy + playerRadius * 0.72 + stride * 0.3, playerRadius * 0.22, 0, Math.PI * 2);
      ctx.arc(pos.sx + playerRadius * 0.35, pos.sy + playerRadius * 0.72 - stride * 0.3, playerRadius * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = c1;
    ctx.beginPath();
    ctx.arc(pos.sx, pos.sy, playerRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = c2;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(pos.sx, pos.sy, playerRadius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = dna.skin;
    ctx.beginPath();
    ctx.arc(pos.sx, pos.sy - playerRadius * 0.92, playerRadius * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = dna.hairCol;
    ctx.beginPath();
    ctx.arc(pos.sx, pos.sy - playerRadius * 0.98, playerRadius * 0.33, Math.PI, Math.PI * 2);
    ctx.fill();

    const lum = parseInt((c1 || '#10b981').replace('#', ''), 16);
    ctx.fillStyle = lum > 0xaaaaaa ? '#0f172a' : '#ffffff';
    ctx.font = `900 ${Math.round(playerRadius * 0.95)}px Cairo, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(p.shirt_number || 10), pos.sx, pos.sy + 0.5);

    const shortName = p.name.split(' ')[0];
    ctx.font = `700 ${Math.max(9, Math.round(playerRadius * 0.76))}px Cairo, sans-serif`;
    const textW = ctx.measureText(shortName).width + 8;
    const tagY = pos.sy + playerRadius + 3;
    ctx.fillStyle = isCarrier ? 'rgba(251, 191, 36, 0.95)' : 'rgba(6, 13, 26, 0.78)';
    ctx.beginPath();
    ctx.roundRect(pos.sx - textW * 0.5, tagY, textW, Math.max(12, playerRadius * 0.92), 4);
    ctx.fill();

    ctx.fillStyle = isCarrier ? '#0f172a' : '#f8fafc';
    ctx.fillText(shortName, pos.sx, tagY + Math.max(6, playerRadius * 0.46));
  }

  const loftScale = 1 + Math.min(0.65, Math.max(0, m.ballZ || 0) * 0.16);
  const ballR = Math.max(4.5, playerRadius * 0.42) * loftScale;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath();
  ctx.ellipse(ballScreen.sx + (m.ballZ || 0) * 2.5, ballScreen.sy + 4 + (m.ballZ || 0) * 3.5, ballR * 0.85, ballR * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  const drawBallY = ballScreen.sy - (m.ballZ || 0) * 4.5;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(ballScreen.sx, drawBallY, ballR, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  const spin = nowMs * 0.012;
  ctx.fillStyle = '#111827';
  ctx.beginPath();
  ctx.arc(ballScreen.sx + Math.cos(spin) * ballR * 0.35, drawBallY + Math.sin(spin) * ballR * 0.35, ballR * 0.35, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

let LIVE_MATCH = null;

function stopMatchLoop() {
  if (MATCH_TIMER_ID !== null) {
    clearInterval(MATCH_TIMER_ID);
    MATCH_TIMER_ID = null;
  }
}

/**
 * Assigns each Goalkeeper a distinct real-world specialist archetype based on their
 * core attributes (reflexes, diving, positioning, handling, speed, height).
 */
function buildGoalkeeperProfile(player, attrs, ovr) {
  const ref = attrs.reflexes || ovr;
  const div = attrs.diving || ovr;
  const pos = attrs.positioning || ovr;
  const han = attrs.handling || ovr;
  const spd = attrs.speed || 54;
  const height = player?.height_cm || 190;

  let archetype = 'BALANCED_WALL';
  let labelAr = 'حارس متكامل';
  if (ref >= div + 2 && ref >= pos) {
    archetype = 'CAT_REFLEX';
    labelAr = 'ردة فعل خارقة';
  } else if (div >= ref && han >= pos) {
    archetype = 'POWER_STOPPER';
    labelAr = 'متخصص التسديدات القوية';
  } else if (spd >= 56 || (ref >= 86 && height <= 190)) {
    archetype = 'SWEEPER_1V1';
    labelAr = 'بارع في الانفرادات';
  } else if (pos >= ref || height >= 194) {
    archetype = 'AERIAL_COMMANDER';
    labelAr = 'سيد التمركز والعرضيات';
  }

  return {
    archetype,
    labelAr,
    reflexes: ref,
    diving: div,
    positioning: pos,
    handling: han,
    speed: spd,
    height,
    overall: ovr
  };
}
